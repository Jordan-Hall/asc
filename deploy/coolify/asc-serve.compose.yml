# asc serve, staging, as a Coolify "Docker Compose" application (SPEC Stage 1).
#
# Not part of the monorepo estate: the image is built elsewhere (deploy/Dockerfile.serve) and
# pushed to forge.example.org/asc/asc-serve:<sha12>. Coolify only pulls and runs it.
#
# No Postgres container: the database is a schema (`asc`) on Forgejo's Postgres, reached through
# the DSN secret ASC_DATABASE_URL. No bucket container either: Garage already runs on the platform.
#
# Every `${VAR:?}` below has no default, so the deploy refuses to start without it. Values live in
# the Coolify application's environment (see asc-serve.env.example and coolify-apply.sh), never in
# this file.
#
# The server reads one TOML file (SPEC 8.1; `asc serve` has no environment overrides apart from
# ASC_SERVE_CONFIG and the AWS_* credentials of the S3 client). The file and the two token files
# are Compose `configs` with inline content, so Compose interpolates the variables into them.
# A value that contains `'` breaks the TOML literal strings: keep secrets URL-safe.

x-asc-serve: &asc-serve
  image: forge.example.org/asc/asc-serve:${ASC_IMAGE_TAG:?pin the sha12 tag of the image}
  # Must be the user Dockerfile.serve creates; the configs below are owned by it, mode 0400.
  user: '${ASC_RUN_UID:-10001}:${ASC_RUN_UID:-10001}'
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment: &asc-serve-env
    ASC_SERVE_CONFIG: /etc/asc/asc-serve.toml
    # The S3 client reads AWS_* (asc-store). The key is the dedicated one from garage-provision.sh.
    AWS_ACCESS_KEY_ID: ${ASC_S3_ACCESS_KEY_ID:?Garage key id from garage-provision.sh}
    AWS_SECRET_ACCESS_KEY: ${ASC_S3_SECRET_ACCESS_KEY:?Garage key secret from garage-provision.sh}
    AWS_REGION: garage
    # Real git (mirror fetch, smart-HTTP views) needs a writable home on the state volume.
    HOME: /var/lib/asc/home
    RUST_LOG: ${ASC_LOG:-info}
  configs: &asc-serve-configs
    - source: asc_serve_toml
      target: /etc/asc/asc-serve.toml
      uid: '${ASC_RUN_UID:-10001}'
      gid: '${ASC_RUN_UID:-10001}'
      mode: 0400
    - source: asc_forgejo_internal_token
      target: /etc/asc/forgejo-internal-token
      uid: '${ASC_RUN_UID:-10001}'
      gid: '${ASC_RUN_UID:-10001}'
      mode: 0400
    - source: asc_forgejo_webhook_secret
      target: /etc/asc/webhook-secret
      uid: '${ASC_RUN_UID:-10001}'
      gid: '${ASC_RUN_UID:-10001}'
      mode: 0400
  volumes:
    - asc-state:/var/lib/asc

services:
  # One-shot schema migration (SPEC 8.2: never at replica start). The server waits for it, the way
  # monorepo's core API waits for database-migrations.
  asc-migrate:
    <<: *asc-serve
    command: ['serve', 'migrate']
    restart: 'no'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m

  # Service name `ascserve` keeps the magic variable below unambiguous (no dashes).
  ascserve:
    <<: *asc-serve
    command: ['serve']
    depends_on:
      asc-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      <<: *asc-serve-env
      # Coolify magic variable: asks Coolify to route a domain to container port 7890 and to
      # generate the proxy labels. The domain itself is set by coolify-apply.sh (ASC_FQDN).
      SERVICE_FQDN_ASCSERVE_7890: ''
    expose:
      - '7890'
    # /readyz fails when the database does not answer or the outbox lags (SPEC 16.1); the admin
    # listener (metrics, detailed readyz) stays on loopback and has no route.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:7890/readyz']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '${ASC_CPU_LIMIT:-2.0}'
          memory: ${ASC_MEM_LIMIT:-2g}
        reservations:
          memory: 512m
    pids_limit: 512
    stop_grace_period: 30s

volumes:
  # Cache disk, git views and the git HOME. Derived data only: it can be deleted and is rebuilt
  # from the bucket and Postgres.
  asc-state:

configs:
  asc_serve_toml:
    content: |
      listen = "0.0.0.0:7890"
      public_url = '${ASC_PUBLIC_URL:?public https URL, e.g. https://asc-staging.example.org}'
      store = 's3://${ASC_S3_BUCKET:-asc-staging}?endpoint=${ASC_S3_ENDPOINT:?Garage S3 endpoint}&region=garage&path_style=true'
      db = '${ASC_DATABASE_URL:?postgres DSN of the asc role, search_path=asc_hub}'
      cache = { memory = "${ASC_CACHE_MEMORY:-512MiB}", disk_dir = "/var/lib/asc/cache", disk = "${ASC_CACHE_DISK:-5GiB}" }

      [auth]
      provider = "forge"

      # Basic credentials from plain git go to the forge (SPEC 15.6.2); the token files below are
      # Forgejo's INTERNAL_TOKEN (required at start by `[forgejo]`) and the webhook secret.
      [forgejo]
      url = '${ASC_FORGEJO_URL:-https://forge.example.org}'
      internal_token_file = "/etc/asc/forgejo-internal-token"
      webhook_secret_file = "/etc/asc/webhook-secret"

      # The admin listener keeps its loopback default: no token file, no route.

      [limits]
      text_memory = "${ASC_TEXT_MEMORY:-512MiB}"
      # Coolify's proxy is in front; only these peers may name the real client in X-Forwarded-For.
      trusted_proxies = ["172.16.0.0/12", "10.0.0.0/8"]

      [git]
      enabled = ${ASC_GIT_ENABLED:-true}
      view_dir = "/var/lib/asc/gitview"

      # No [ssh] section: the SSH listener is not part of this deployment.
  asc_forgejo_internal_token:
    content: ${ASC_FORGEJO_INTERNAL_TOKEN:?Forgejo INTERNAL_TOKEN}
  asc_forgejo_webhook_secret:
    content: ${ASC_FORGEJO_WEBHOOK_SECRET:?shared secret of the Forgejo push webhook}
