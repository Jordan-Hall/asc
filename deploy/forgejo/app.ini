; Forgejo for the deploy bundle (U51). Local development only: every secret below is public.
; Forgejo creates new repositories on `master`, never `main` (the same setting as the
; FORGEJO__repository__DEFAULT_BRANCH=master variable in compose.yml).
APP_NAME = asc deploy bundle
RUN_MODE = prod
WORK_PATH = /data/gitea

[server]
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
DOMAIN = 127.0.0.1
ROOT_URL = http://127.0.0.1:13000/
DISABLE_SSH = true
OFFLINE_MODE = true

[database]
DB_TYPE = sqlite3
PATH = /data/gitea/forgejo.db

[repository]
ROOT = /data/git/repositories
DEFAULT_BRANCH = master

[security]
INSTALL_LOCK = true
SECRET_KEY = deploy-bundle-dev-secret-key-not-for-production
INTERNAL_TOKEN = deploy-bundle-dev-internal-token-not-for-production-0123456789abcdef

[oauth2]
JWT_SECRET = deploy-bundle-dev-jwt-secret-not-for-production-0123

[lfs]
; No LFS (fixed decision).
START_SERVER = false

[service]
DISABLE_REGISTRATION = true

[log]
MODE = console
LEVEL = Info
