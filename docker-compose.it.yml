# Integration-test services: `docker compose -f docker-compose.it.yml up -d`.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: asctest
      MINIO_ROOT_PASSWORD: asctest-secret
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c", "mc alias set l http://minio:9000 asctest asctest-secret && mc mb --ignore-existing l/asc-it"]
  garage:
    image: dxflrs/garage:v1.0.1
    ports: ["3900:3900", "3903:3903"]
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 3s
      retries: 20
  garage-init:
    image: curlimages/curl:8.10.1
    depends_on:
      garage: {condition: service_healthy}
    volumes:
      - ./deploy/garage-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: asc
      POSTGRES_PASSWORD: asc
      POSTGRES_DB: asc
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asc"]
      interval: 5s
      retries: 10
