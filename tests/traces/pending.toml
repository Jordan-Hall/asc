# Gaps between the trace corpus and the native table (docs/SPEC.md §11.5).
#
# `cargo test -p asc --test traces` replays every trace through the asc shim. An invocation that
# the native table does not serve fails with `fatal: asc: … is not supported`; the asc side then
# stops following the recording, so the trace cannot be compared with git. Each such gap is
# listed here with the PLAN unit that closes it. The test fails on a gap that is not listed,
# and prints a stale entry as a warning. `ASC_TRACES_STRICT=1` (the compat gate, PLAN U25) fails on
# any entry, so this file must be empty before the gate passes.
#
# The unit that serves an invocation removes its entry; a gap that appears behind it (the asc
# side now gets further) is added or fixed by the same unit. An entry with `differs = true`
# means the trace runs to the end but asc's output or post-state still differs from git's.

