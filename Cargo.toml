[workspace]
resolver = "3"
members = [
    "crates/asc-core",
    "crates/asc-graph",
    "crates/asc-state",
    "crates/asc-sim",
    "crates/asc-store",
    "crates/asc-engine",
    "crates/asc-git",
    "crates/asc-rpc",
    "crates/asc-mcp",
    "crates/asc-wc",
    "crates/asc-vfs",
    "crates/asc-serve",
    "crates/asc-ci",
    "crates/asc-embed",
    "crates/asc-codeintel",
    "crates/asc",
    "tests/turbo",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
# internal crates
asc-core = { path = "crates/asc-core" }
asc-store = { path = "crates/asc-store" }
asc-engine = { path = "crates/asc-engine" }
asc-git = { path = "crates/asc-git", default-features = false }   # every consumer that wants the git protocol layer names `git-compat` (SPEC 25.9)
asc-rpc = { path = "crates/asc-rpc", default-features = false }   # `asc` and `asc-serve` forward `http3` themselves (U89b)
asc-wc = { path = "crates/asc-wc" }
asc-vfs = { path = "crates/asc-vfs" }
asc-serve = { path = "crates/asc-serve", default-features = false }   # `asc` forwards `git-compat` itself (SPEC 25.9)
asc-ci = { path = "crates/asc-ci" }
asc-codeintel = { path = "crates/asc-codeintel" }
asc-mcp = { path = "crates/asc-mcp" }

# storage
object_store   = { version = "0.14.2", default-features = false, features = ["fs", "aws"] }
redb           = "4.4.0"
sqlx           = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "migrate", "macros", "any"] }
# hashing / compression / chunking / encoding
blake3         = { version = "1.8.7", features = ["rayon"] }
sha1           = "0.11.0"
zstd           = "0.14.3"
fastcdc        = { version = "5.0.0", features = ["tokio"] }
postcard       = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde          = { version = "1.0.229", features = ["derive"] }
serde_json     = "1.0.154"
# rpc / ipc / http
tonic          = { version = "0.14.6", features = ["zstd"] }
tonic-prost    = "0.14.6"
prost          = "0.14.4"
tonic-health   = "0.14.6"
tonic-prost-build = "0.14.6"   # build-dependency of asc-proto
protox          = "0.10.0"   # build-dependency of asc-rpc: in-process .proto compiler
axum           = "0.8.9"
tower          = "0.5.3"
http-body      = "1.0.1"
tower-http     = "0.7.1"
hyper          = "1.12.0"
hyper-util     = "0.1.21"
interprocess   = { version = "2.4.6", features = ["tokio"] }
rustls         = "0.23.46"
# HTTP/3 (U89b, feature `http3`): QUIC with rustls on `ring`; no OpenSSL, no aws-lc-sys added.
quinn          = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3             = "0.0.8"
h3-quinn       = "0.0.10"
http           = "1.5.0"
rustls-platform-verifier = "0.7.1"   # the verifier reqwest's `rustls` feature already uses
# async
tokio          = { version = "1.54.1", features = ["full"] }
tokio-util     = "0.7.20"
tokio-stream   = "0.1.19"
futures        = "0.3.34"
bytes          = "1.12.1"
backon         = "1.6.0"
# vfs (target-specific in member crates)
windows        = { version = "=0.62.2", features = ["Win32_Storage_ProjectedFileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_IO"] }
libloading     = "0.9.0"
windows-service = "0.8.1"
fuser          = { version = "0.18.0", default-features = false }
nfs3_server    = "0.11.1"
rustix         = { version = "1.1.5", features = ["fs"] }
# working copy
notify         = "8.2.0"
notify-debouncer-full = "0.7.0"
ignore         = "0.4.33"
globset        = "0.4.20"
reflink-copy   = "0.1.30"
memmap2        = "0.9.12"
# git interop (gix family moves in lock-step: pin exactly)
gix            = { version = "=0.89.0", default-features = false, features = ["max-performance-safe", "revision", "blob-diff"] }
gix-config     = "=0.62.1"
gix-date       = "=0.18.1"     # gix 0.89 family; git date parsing for commit --date (U22)
gix-sec        = "=0.16.0"     # gix 0.89 family; names the Trust type of gix-config (U20 security)
windows-sys    = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }
# diff / merge
imara-diff     = "0.2.0"
similar        = { version = "3.2.0", features = ["inline"] }
diffy          = "0.5.2"       # v0 merge fallback only
# cli / ux
clap           = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
anstream       = "1.0.0"
indicatif      = "0.18.6"
# caches / util
quick_cache    = "0.7.0"
camino         = "1.2.6"
bstr           = "1.13.1"
compact_str    = "0.10.0"
smallvec       = "1.16.3"
jiff           = "0.2.38"
rayon          = "1.12.0"
parking_lot    = "0.13.0"
arc-swap       = "1.9.3"
data-encoding  = "2.11.1"
uuid           = { version = "1.28.0", features = ["v4", "v7"] }
linkme         = "0.3.37"
toml           = "1.1.8"
etcetera       = "0.11.0"
automod        = "1.0.17"
thiserror      = "2.0.21"
anyhow         = "1.0.104"
tracing        = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# mcp (M03): no `macros`, no `schemars`, no `auth` (SPEC 22.7.1)
rmcp           = { version = "3.6.0", default-features = false, features = ["server", "base64", "transport-io", "transport-async-rw", "transport-streamable-http-server", "elicitation", "request-state"] }
# test
insta          = "1.49.0"
proptest       = "1.12.0"
tempfile       = "3.27.0"
testcontainers = "0.28.0"
testcontainers-modules = { version = "0.15.0", features = ["minio", "postgres"] }
# additions (U01)
gix-index      = "=0.57.0"     # gix 0.89 family
gix-merge      = { version = "=0.22.0", default-features = false }
gix-hash       = { version = "=0.28.1", features = ["sha1"] }  # gix 0.89 family; sha1 feature selects the hash
async-trait    = "0.1.92"
base64         = "0.23.1"
regex          = "1.13.1"
memchr         = "2.8.3"
filetime       = "0.2.29"
sha2           = "0.11.1"
url            = "2.5.4"       # asc-store (U07)
reqwest        = { version = "0.13.5", default-features = false, features = ["rustls"] }   # asc-serve (U44)
# additions (U01b)
gix-attributes = "=0.37.1"     # gix 0.89 family
gix-imara-diff = "=0.3.2"      # gix 0.89 family; names gix-merge's InternedInput (U26)
quick-xml      = "0.42.0"
governor       = "0.10.4"
prost-reflect  = "0.16.5"
same-file      = "1.0.6"
tar            = "0.4.46"
zip            = { version = "9.0.5", default-features = false, features = ["deflate"] }
minisign-verify = "0.3.0"
prometheus-client = "0.25.1"
opentelemetry  = "0.33.1"
opentelemetry-otlp = "0.33.1"
tracing-opentelemetry = "0.34.0"
hmac           = "0.13.0"
percent-encoding = "2.3.2"
libfuzzer-sys  = "0.4.13"      # fuzz targets only
turmoil        = "0.7.2"       # dev
criterion      = "0.8.2"       # dev
asc-graph = { path = "crates/asc-graph" }
asc-state = { path = "crates/asc-state" }
asc-sim = { path = "crates/asc-sim" }
# additions (I09)
fastembed      = { version = "=7.2.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
ort            = "=2.0.0-rc.15"
# additions (I03)
tree-sitter            = "=0.27.1"
tree-sitter-language   = "=0.1.9"
tree-sitter-rust       = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-python     = "=0.25.0"
tree-sitter-c-sharp    = "=0.23.5"
tree-sitter-go         = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
# additions (I05)
roaring        = "=0.10.12"
# additions (I06)
tantivy        = { version = "=0.27.0", default-features = false, features = ["mmap"] }
# additions (I10)
usearch        = { version = "=2.26.5", default-features = false }
# additions (I02)
regex-syntax   = "0.8.11"

# Faster builds and much smaller target dirs (2026-10-23): line tables are enough for our own
# backtraces; dependencies carry no debug info. Tests inherit the dev profile.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
