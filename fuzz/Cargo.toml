[package]
name = "asc-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

# cargo-fuzz drives this crate; it is its own workspace so the main build never sees it.
[package.metadata]
cargo-fuzz = true

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
asc-core = { path = "../crates/asc-core" }
asc-graph = { path = "../crates/asc-graph" }
asc-engine = { path = "../crates/asc-engine" }
asc-store = { path = "../crates/asc-store" }
asc-git = { path = "../crates/asc-git" }
# No `http3`: the fuzz bodies need the descriptor set, JSON codec and name types, not QUIC.
asc-rpc = { path = "../crates/asc-rpc", default-features = false }
libfuzzer-sys = "0.4.13"
prost-reflect = "0.16.5"
serde_json = "1.0.154"

[[bin]]
name = "envelope_decode"
path = "fuzz_targets/envelope_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "git_commit_parse_canonicalise"
path = "fuzz_targets/git_commit_parse_canonicalise.rs"
test = false
doc = false
bench = false

