[package]
name = "asc-bench-codeintel-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
description = "Semantic eval set from ASC history and the embedding model bake-off (PLAN I28, SPEC 23.9)"

# Standalone like bench/codeintel (TODO(O05): add to the workspace members, and forward
# `asc-bench --suite codeintel-eval` to this binary).
[workspace]

[dependencies]
clap       = { version = "4.6.7", features = ["derive"] }
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "deny"
