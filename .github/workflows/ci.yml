name: ci
# Linux gate: Rust format, clippy and the workspace tests; the @asc/build-cache plugins and runner against the asc
# they call; the TypeScript workspaces (oxlint, typecheck, tests); the web UI in Chromium; the PostgreSQL-backed server tests and the S3
# suite against three Garage versions, both on loopback without Docker. Windows: the workspace tests other than the
# git-oracle and server suites, and the virtual (ProjFS) workspace tests, which need the ProjFS driver. The JetBrains
# plugin: its unit tests, build and structure check.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # ~100 test binaries: no debug info and no incremental data keep the runner's disk from filling.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      # Tests compare against the pinned git only (docs/git-fidelity.md); ASC_GIT_ORACLE and
      # ASC_REAL_GIT are appended to the job environment by the "Pinned git oracle" step.
      ASC_ORACLE_STRICT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The pinned git is built from its sha256-verified tarball; the build is cached on the pins.
      - name: Pinned git oracle cache
        id: oracle-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/asc-oracle
          key: git-oracle-${{ runner.os }}-${{ hashFiles('build/git-oracle/pins.env', 'build/git-oracle/oracle.sh') }}
      - name: Pinned git oracle build tools
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq build-essential libcurl4-openssl-dev zlib1g-dev xz-utils curl && exit 0
            sleep 20
          done
          exit 1
      - name: Pinned git oracle
        run: |
          set -euo pipefail
          bash build/git-oracle/oracle.sh fetch
          bash build/git-oracle/oracle.sh verify
          bash build/git-oracle/oracle.sh env | tee -a "$GITHUB_ENV"
      # Saved here, not at the end of the job, so a failing test run still keeps the build.
      - name: Pinned git oracle cache save
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/asc-oracle
          key: ${{ steps.oracle-cache.outputs.cache-primary-key }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      # nextest's `ci` profile (.config/nextest.toml) retries only the binaries that race for a free port.
      - name: Test
        run: cargo nextest run --workspace --locked --profile ci
      - name: Doc tests
        run: cargo test --workspace --locked --doc

  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build asc
        run: cargo build -p asc --locked
      - name: Typecheck
        working-directory: packages/asc-build-cache
        run: bun run typecheck
      - name: Test (Rsbuild, Rslib, Vite, Rstest)
        working-directory: packages/asc-build-cache
        env:
          ASC_BIN: ${{ github.workspace }}/target/debug/asc
        run: bun test

  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The TypeScript protobuf code is generated (gitignored); everything below imports it.
      - name: Generate the protobuf client
        working-directory: packages/asc-client-ts
        run: bun run codegen
      - name: Lint
        run: node_modules/.bin/oxlint --no-error-on-unmatched-pattern .
      - name: Typecheck
        run: |
          set -euo pipefail
          for d in web packages/asc-client-ts packages/asc-fixtures packages/asc-ui packages/asc-ui-devhost plugins/vscode; do
            echo "::group::$d"
            (cd "$d" && bun run typecheck)
            echo "::endgroup::"
          done
      - name: Test
        run: |
          set -euo pipefail
          for d in web packages/asc-client-ts packages/asc-fixtures packages/asc-ui packages/asc-ui-devhost plugins/vscode; do
            echo "::group::$d"
            (cd "$d" && bun run test)
            echo "::endgroup::"
          done
      - name: Benchmark harness
        run: node --test bench/git-baseline/bench.test.mjs

  # The web UI in Chromium against a production-like static server (web/e2e/serve.ts): every route in light and dark at
  # 1440 and 390, axe WCAG 2.2 AA, console errors, CLS, the CSP read from asc-serve, keyboard, and the visual baselines in
  # web/e2e/visual.spec.ts-snapshots/ (captured by web-baselines.yml on this same image).
  web-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Generate the protobuf client
        working-directory: packages/asc-client-ts
        run: bun run codegen
      - name: Install Chromium
        working-directory: web
        # The system packages come from apt, whose mirrors flake: three tries.
        run: |
          for i in 1 2 3; do
            bun x playwright install --with-deps chromium && exit 0
            sleep 30
          done
          exit 1
      - name: Playwright
        working-directory: web
        run: bun x playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-results
          path: web/test-results/
          if-no-files-found: ignore

  # The asc-serve lib tests that take ASC_TEST_POSTGRES_URL, against a throwaway PostgreSQL on loopback (no Docker).
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The runner image ships the server binaries; apt is only the fallback, retried because its mirrors flake.
      - name: PostgreSQL server
        run: |
          ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 && exit 0
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql && exit 0
            sleep 20
          done
          exit 1
      - run: bash build/ci/postgres-it.sh

  # asc-store's S3 suite against real Garage (no Docker); results in docs/garage-compat.md.
  # The Garage binaries have no published checksums, so the hashes are the ones recorded when first fetched.
  garage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - garage: v1.3.1
            sha256: 0441419f7c0b372d37e533a80e08367023d30fa56a56d1db3f8a2aff27e24c92
          - garage: v2.3.0
            sha256: f98d317942bb341151a2775162016bb50cf86b865d0108de03eb5db16e2120cd
          - garage: v2.4.1
            sha256: ae49f8de4aaee6b5ca305f7cbdccc8cd8a29b2804aac074649f18bfb83d0a2b6
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch Garage ${{ matrix.garage }}
        run: |
          mkdir -p "$HOME/garage-bin"
          curl -fsSL --proto '=https' -o "$HOME/garage-bin/garage" "https://garagehq.deuxfleurs.fr/_releases/${{ matrix.garage }}/x86_64-unknown-linux-musl/garage"
          echo "${{ matrix.sha256 }}  $HOME/garage-bin/garage" | sha256sum -c -
          chmod +x "$HOME/garage-bin/garage"
      # All three versions ignore If-None-Match, so the probe must fail (BucketRefs refused); a change here is news.
      - run: GARAGE_BIN="$HOME/garage-bin/garage" ASC_IT_GARAGE_EXPECT_EXCLUSIVE=false bash build/ci/garage-it.sh

  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      # The asc unit tests and every library crate; the git-oracle suites (pinned git is built on Linux) and the
      # server, which ships for Linux, stay on the Linux job. The virtual workspace has its own job below.
      - name: Test
        run: cargo nextest run --locked --profile ci --workspace --exclude asc --exclude asc-serve
      - name: asc unit tests
        run: cargo nextest run --locked --profile ci -p asc --bins

  # macOS serves virtual workspaces through the loopback NFS server; nothing else compiles that
  # path, so the build, lints and the in-process NFS tests run here.
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - name: Clippy (NFS backend and the daemon host)
        run: cargo clippy --locked -p asc-vfs -p asc --features asc-vfs/nfs --all-targets -- -D warnings
      - name: NFS tests
        run: cargo nextest run --locked --profile ci -p asc-vfs --features nfs
      - name: asc unit tests
        run: cargo nextest run --locked --profile ci -p asc --bins

  # The FUSE tests that mount a real file system; they need /dev/fuse and fusermount.
  fuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: FUSE
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq fuse3 && break
            sleep 20
          done
          sudo chmod 0666 /dev/fuse
          grep -qx user_allow_other /etc/fuse.conf || echo user_allow_other | sudo tee -a /etc/fuse.conf
          ls -l /dev/fuse
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Mounted FUSE tests
        run: 'cargo test --locked -p asc-vfs --features fuse,nfs --lib -- --include-ignored --test-threads=1 fuse::'
      - name: Virtual workspaces end to end over FUSE
        run: 'cargo test --locked -p asc --test unix_virtual -- --ignored --test-threads=1'

  jetbrains:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: 8.14.3
      # The unit tests (plugin.xml against the code among them), then the plugin built and checked by the
      # IntelliJ Plugin Verifier against the IDE it targets.
      - name: Test, build and verify
        working-directory: plugins/jetbrains
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then g=./gradlew; else g=gradle; fi
          "$g" test buildPlugin verifyPluginStructure

  projfs:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Enable ProjFS
        shell: pwsh
        run: |
          Enable-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -NoRestart -All | Out-Null
          $svc = Get-Service prjflt -ErrorAction Stop
          if ($svc.Status -ne 'Running') { Start-Service prjflt }
          (Get-Service prjflt).Status
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the virtual workspace tests
        run: cargo test -p asc --locked --test windows_virtual --no-run
      - name: Virtual workspace tests
        shell: bash
        timeout-minutes: 60
        env:
          RUST_BACKTRACE: '1'
        # One test at a time, each with a limit, so a test that hangs is named and the others still report.
        # The built test binary runs directly: going through cargo again would rebuild asc for every test.
        run: |
          bin=$(cargo test -p asc --locked --test windows_virtual --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "windows_virtual" and .executable != null) | .executable')
          bin=$(cygpath -u "$bin")
          test -x "$bin" || { echo "::error::no windows_virtual test binary"; exit 1; }
          cd crates/asc
          status=0
          for t in $("$bin" --include-ignored --list --format terse | sed -n 's/: test$//p'); do
            echo "::group::$t"
            if ! timeout 300 "$bin" --include-ignored --exact --nocapture "$t"; then
              echo "::error::$t failed or ran over 5 minutes"
              status=1
            fi
            # A test stopped by the limit leaves its daemon and test binary running, holding asc.exe open.
            taskkill //F //T //IM asc.exe >/dev/null 2>&1 || true
            taskkill //F //T //IM 'windows_virtual-*' >/dev/null 2>&1 || true
            echo "::endgroup::"
          done
          exit $status
