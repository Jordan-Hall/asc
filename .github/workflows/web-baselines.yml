name: web-baselines
# Captures the visual-regression baselines of the web UI (web/e2e/visual.spec.ts) on the same Linux image and
# Chromium as the `web-e2e` job in ci.yml, and uploads them as an artifact to review and commit under
# web/e2e/visual.spec.ts-snapshots/. Run it after an intended visual change (docs/WEB-UI.md, "Visual baselines").
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Generate the protobuf client
        working-directory: packages/asc-client-ts
        run: bun run codegen
      - name: Install Chromium
        working-directory: web
        run: bun x playwright install --with-deps chromium
      - name: Capture
        working-directory: web
        run: bun x playwright test e2e/visual.spec.ts --update-snapshots=all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: web/e2e/visual.spec.ts-snapshots/
          if-no-files-found: error
