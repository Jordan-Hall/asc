name: image
# `asc serve` image on GitHub Container Registry (private package):
#   push to master -> ghcr.io/<owner>/asc-serve:<sha12> and :master
#   tag v*         -> :<sha12> and :<version>
#   pull_request   -> build only, nothing published
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Sign in to ghcr.io
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/asc-serve"
          sha="${GITHUB_SHA::12}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then name="${GITHUB_REF_NAME#v}"; else name="$(echo "$GITHUB_REF_NAME" | tr '/' '-')"; fi
          printf 'list=%s:%s,%s:%s\n' "$image" "$sha" "$image" "$name" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile.serve
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A new asc-serve image on master rebuilds the hub image on it, and the hub workflow deploys that image. Skipped
  # while either is unset:
  #   variable ASC_HUB_REPO            owner/name of the hub repository
  #   secret   ASC_HUB_DISPATCH_TOKEN  a token that may start workflows in it and set its variables
  #                                    (actions: write, variables: write)
  hub:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.ASC_HUB_DISPATCH_TOKEN }}
      HUB_REPO: ${{ vars.ASC_HUB_REPO }}
    steps:
      - name: Start the hub image build on this asc-serve image
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ] || [ -z "$HUB_REPO" ]; then
            echo "::warning::ASC_HUB_REPO or ASC_HUB_DISPATCH_TOKEN is not set; the hub is not rebuilt on this image"
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/asc-serve:${GITHUB_SHA::12}"
          # Pinned for the hub's own pushes too, so they build on the newest asc and not an older pin.
          gh variable set ASC_SERVE_IMAGE --repo "$HUB_REPO" --body "$image"
          gh workflow run asc-hub-image.yml --repo "$HUB_REPO" --ref asc/v16 -f asc_image="$image"
          echo "::notice::started the hub image build on $image"
