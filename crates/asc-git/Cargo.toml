[package]
name = "asc-git"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["git-compat"]
# The git smart-HTTP compatibility layer (SPEC 25): `asc_git::compat`. Off, the module and its
# platform dependencies do not exist.
git-compat = ["dep:rustix", "dep:windows-sys"]

[dependencies]
asc-core = { workspace = true }
asc-store = { workspace = true }
asc-engine = { workspace = true }
asc-state = { workspace = true }
gix = { workspace = true }
gix-config = { workspace = true }
gix-hash = { workspace = true }
gix-index = { workspace = true }
gix-sec = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
filetime = { workspace = true }
sha1 = { workspace = true }
same-file = { workspace = true }
async-trait = { workspace = true }
quick_cache = { workspace = true }
data-encoding = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

# Child supervision of `compat::ServerGit`: a Job Object on Windows, a process group and rlimits on
# Unix. Both are optional so that a build without `git-compat` never links them.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true, features = ["process"] }
