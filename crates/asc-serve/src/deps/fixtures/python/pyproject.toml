[project]
name = "app"
version = "0.1.0"
dependencies = [
    "requests>=2.28,<3",
    "Django==3.2.0",
    "pydantic[email] (>=1.10)",
    "anyname",
    "urllib3 @ https://example.com/urllib3.tar.gz",
]

[project.optional-dependencies]
test = ["pytest~=7.2.0"]

[dependency-groups]
lint = ["ruff>=0.1.0"]

[tool.poetry.dependencies]
python = "^3.9"
httpx = "^0.23.0"
local = { path = "../local" }
fastapi = { version = "^0.95.0", extras = ["all"] }

[tool.poetry.group.dev.dependencies]
black = "22.12.0"
