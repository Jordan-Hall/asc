[package]
name = "asc-serve"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["git-compat"]
# The git smart-HTTP layer (SPEC 25); forwards to `asc-git`.
git-compat = ["asc-git/git-compat"]
# Runs real `turbo` against the server (needs bunx and network).
it-turbo = []

[dependencies]
asc-core = { workspace = true }
asc-rpc = { workspace = true }
asc-git = { workspace = true }
asc-store = { workspace = true }
asc-engine = { workspace = true }
asc-graph = { workspace = true }
asc-codeintel = { path = "../asc-codeintel" }
roaring = { workspace = true }
blake3 = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
quick_cache = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
gix-attributes = { workspace = true }
bstr = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
object_store = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
http-body = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true, features = ["tls-ring"] }
tracing = { workspace = true }
url = { workspace = true }
prometheus-client = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
getrandom = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
