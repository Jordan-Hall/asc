[package]
name = "asc-rpc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
asc-core = { workspace = true }
asc-engine = { workspace = true }
asc-graph = { workspace = true }
asc-store = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true, features = ["tls-ring", "tls-native-roots", "tls-webpki-roots"] }
async-trait = { workspace = true }
blake3 = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tonic-prost = { workspace = true }
prost-reflect = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
postcard = { workspace = true }
interprocess = { workspace = true }
tower = { workspace = true }
hyper-util = { workspace = true }
tokio-stream = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }


[dev-dependencies]
protox = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }

[build-dependencies]
prost = { workspace = true }
protox = { workspace = true }
tonic-prost-build = { workspace = true }
