[package]
name = "asc-ci"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
asc-core = { workspace = true }
asc-wc = { workspace = true }
asc-git = { workspace = true }
asc-rpc = { workspace = true }
asc-store = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
blake3 = { workspace = true }
globset = { workspace = true }
postcard = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["process", "time", "io-util", "rt", "macros", "sync"] }
tokio-util = { workspace = true }
getrandom = "0.4"

[target.'cfg(unix)'.dependencies]
# Kills the process group of a command that ends, times out or is cancelled (sandbox.rs).
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
tempfile = { workspace = true }
