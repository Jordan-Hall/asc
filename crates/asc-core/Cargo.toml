[package]
name = "asc-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
blake3.workspace = true
data-encoding.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
bytes.workspace = true
fastcdc.workspace = true
sha1.workspace = true
url.workspace = true
toml.workspace = true
regex.workspace = true
# SSHSIG signatures over changesets (sshsig.rs). The features are the key kinds asc accepts.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ed25519", "p256", "rsa"] }

[dev-dependencies]
proptest.workspace = true
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ed25519", "p256", "rsa", "rand_core", "getrandom"] }
