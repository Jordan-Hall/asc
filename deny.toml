[graph]
all-features = true

[advisories]
version = 2
# RUSTSEC-2024-0436 (paste, unmaintained): a compile-time proc macro with no runtime code, reached only
# through asc-embed -> fastembed 7.x -> tokenizers 0.23.2. No fix exists: tokenizers 0.23.x requires it,
# fastembed 7.5.0 (latest) still pins tokenizers ^0.23.2, and only the 1.0.0-rc tokenizers drops it.
# Remove this entry once fastembed accepts tokenizers 1.x.
ignore = [{ id = "RUSTSEC-2024-0436", reason = "build-time proc macro only; blocked on fastembed -> tokenizers 1.x" }]

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "BSL-1.0", "0BSD", "CDLA-Permissive-2.0",
    "OpenSSL", "Unlicense",
]
# GPL, AGPL and LGPL are not allowed (anything unlisted is denied).
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
