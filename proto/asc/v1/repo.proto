syntax = "proto3";
package asc.v1;
import "asc/v1/options.proto";

enum IdMode { ID_MODE_ASC = 0; ID_MODE_GIT = 1; }   // GIT: changeset/tree/file ids are git oids (20 bytes) in and out
message RepoRef { string name = 1; IdMode id_mode = 2; }   // name = "owner/repo"

enum ObjKind { OBJ_KIND_UNSPECIFIED = 0; OBJ_KIND_FILE = 1; OBJ_KIND_CHUNK_LIST = 2; OBJ_KIND_CHUNK = 3;
               OBJ_KIND_TREE = 4; OBJ_KIND_CHANGESET = 5; OBJ_KIND_TAG = 6; OBJ_KIND_GIT_TREE_OVERRIDE = 7;
               reserved 8; OBJ_KIND_CHANGE_META = 9; }   // 8 was SHA256_ALIAS (removed with LFS); 9 = ChangeMeta (§20.2)
message ObjKey { ObjKind kind = 1; bytes id = 2 [(asc.v1.json) = JSON_KIND_HEX]; }          // 32 bytes (20 for GIT_TREE_OVERRIDE)
message Object { ObjKey key = 1; bytes data = 2 [(asc.v1.json) = JSON_KIND_DATA]; }          // stored bytes: codec ‖ data

message RefTarget { oneof t { bytes changeset = 1 [(asc.v1.json) = JSON_KIND_HEX]; bytes tag = 2 [(asc.v1.json) = JSON_KIND_HEX]; } }
message Ref { string name = 1; RefTarget target = 2; uint64 version = 3; int64 expires_at = 4; }
message Signature { bytes name = 1 [(asc.v1.json) = JSON_KIND_TEXT]; bytes email = 2 [(asc.v1.json) = JSON_KIND_TEXT]; int64 time = 3; int32 tz_min = 4; }

service Repo {
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc HasObjects(HasObjectsRequest) returns (HasObjectsResponse);
  rpc GetObjects(stream GetObjectsRequest) returns (stream GetObjectsResponse);
  rpc PutObjects(stream PutObjectsRequest) returns (PutObjectsResponse);
  rpc ListRefs(ListRefsRequest) returns (ListRefsResponse);
  rpc UpdateRefs(UpdateRefsRequest) returns (UpdateRefsResponse);
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  rpc GitMap(GitMapRequest) returns (GitMapResponse);
  rpc Log(LogRequest) returns (stream LogResponse);
  rpc MergeBase(MergeBaseRequest) returns (MergeBaseResponse);
  rpc IsAncestor(IsAncestorRequest) returns (IsAncestorResponse);
  rpc Diff(DiffRequest) returns (stream DiffResponse);
  rpc Blame(BlameRequest) returns (stream BlameResponse);
  rpc LastCommits(LastCommitsRequest) returns (LastCommitsResponse);
  rpc ReadChangeset(ReadChangesetRequest) returns (ReadChangesetResponse);
  rpc ReadTree(ReadTreeRequest) returns (stream ReadTreeResponse);
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileResponse);
  rpc Stat(StatRequest) returns (StatResponse);
  rpc CheckAttr(CheckAttrRequest) returns (CheckAttrResponse);
  rpc Grep(GrepRequest) returns (stream GrepResponse);
  rpc Archive(ArchiveRequest) returns (stream ArchiveResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc Merge(MergeRequest) returns (MergeResponse);
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  rpc CopyClosure(CopyClosureRequest) returns (CopyClosureResponse);
  rpc RepoAdmin(RepoAdminRequest) returns (RepoAdminResponse);
  rpc ImportGitPush(ImportGitPushRequest) returns (ImportGitPushResponse);   // host service token only
  rpc Ingest(IngestRequest) returns (IngestResponse);                        // §8.7
  rpc FindLanding(FindLandingRequest) returns (FindLandingResponse);         // §8.9
  rpc Classify(ClassifyRequest) returns (ClassifyResponse);                  // §8.10
  rpc Rebase(RebaseRequest) returns (RebaseResponse);                        // §8.11
  rpc CommitGraph(CommitGraphRequest) returns (stream CommitGraphResponse);  // §20.6; not the project graph of `asc graph`
  rpc LineHistory(LineHistoryRequest) returns (stream LogResponse);          // §20.6; takes scan_budget
  rpc Compare(CompareRequest) returns (CompareResponse);                     // §20.6
  rpc RepoConfig(RepoConfigRequest) returns (RepoConfigResponse);            // autolinks, review.toml at a rev
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);             // repository policy (.asc/policy.toml on trunk), read-only; repo read
  rpc WatchRefs(WatchRefsRequest) returns (stream RefEvent);               // §21.3.8; long-lived, ACL-filtered, resumable; x-asc-op-id not used
}
// service Projects (ProjectGraph, Affected, ProjectHashes) is in proto/asc/v1/projects.proto (§12A.8), on the same port.

message VersionRequest {}
message VersionResponse { string server_version = 1; string min_client = 2; repeated string features = 3; }

message HasObjectsRequest { RepoRef repo = 1; repeated ObjKey keys = 2; }           // ≤ 4096 keys
message HasObjectsResponse { bytes present = 1 [(asc.v1.json) = JSON_KIND_UNSPECIFIED]; }                                   // bitmap, LSB-first per byte
message GetObjectsRequest { RepoRef repo = 1; repeated ObjKey keys = 2; }           // ≤ 256 keys per message
message GetObjectsResponse { repeated Object objects = 1; repeated ObjKey missing = 2; } // ≤ 16 MiB per message
message PutObjectsRequest { RepoRef repo = 1; repeated Object objects = 2; }
message PutObjectsResponse { uint64 stored = 1; uint64 already_present = 2; }

message ListRefsRequest { RepoRef repo = 1; string prefix = 2; bytes contains = 3 [(asc.v1.json) = JSON_KIND_HEX]; string after = 4; uint32 limit = 5; }
message ListRefsResponse { repeated Ref refs = 1; string next = 2; string head = 3; }   // after/next = opaque page token; head = symbolic HEAD
message RefUpdate { string name = 1;
  oneof expect { bool any = 2; bool absent = 3; RefTarget value = 4; }
  RefTarget new = 5;  bool delete = 6; }
enum UpdateMode { UPDATE_MODE_FAST_FORWARD = 0; UPDATE_MODE_FORCE = 1; UPDATE_MODE_LAND = 2; }
enum HookMode { HOOK_MODE_RUN = 0; HOOK_MODE_SKIP_PRE = 1; }                        // SKIP_PRE: internal token only
message UpdateRefsRequest { RepoRef repo = 1; repeated RefUpdate updates = 2; UpdateMode mode = 3;
  repeated string push_options = 4; HookMode hooks = 5; int64 ttl_seconds = 6;
  bool no_content_merge = 7; }   // no_content_merge: LAND only (§20.5)
message Rewrite { bytes old = 1 [(asc.v1.json) = JSON_KIND_HEX]; bytes new = 2 [(asc.v1.json) = JSON_KIND_HEX]; }
message RefResult { string name = 1; RefTarget old = 2; RefTarget new = 3;
  bool user = 4; }   // user: stored as the pusher's user ref (SPEC §21.5.1), under `refs/users/`
message UpdateRefsResponse { repeated RefResult results = 1; repeated Rewrite rewritten = 2; string message = 3; }

message ResolveRequest { RepoRef repo = 1; repeated string revspecs = 2; }
message ResolveResponse { repeated bytes ids = 1 [(asc.v1.json) = JSON_KIND_HEX]; }                                  // empty bytes = not found
message GitMapRequest { RepoRef repo = 1; repeated bytes asc = 2 [(asc.v1.json) = JSON_KIND_HEX]; repeated bytes git = 3 [(asc.v1.json) = JSON_KIND_HEX]; }
message GitMapResponse { repeated bytes asc_to_git = 1 [(asc.v1.json) = JSON_KIND_HEX]; repeated bytes git_to_asc = 2 [(asc.v1.json) = JSON_KIND_HEX]; }

message LogRequest { RepoRef repo = 1; repeated string include = 2; repeated string exclude = 3;
  repeated string paths = 4; bool first_parent = 5; bool follow = 6; uint32 skip = 7; uint32 limit = 8;
  string author = 9; string grep = 10; int64 since = 11; int64 until = 12; bool count_only = 13; string page_token = 14;
  bytes pickaxe = 15 [(asc.v1.json) = JSON_KIND_TEXT]; bool pickaxe_regex = 16; bool with_stats = 17;
  uint32 scan_budget = 18; /* candidates, default 10000 */ string resume_token = 19; }
message LogEntry { bytes id = 1 [(asc.v1.json) = JSON_KIND_HEX]; bytes git = 2 [(asc.v1.json) = JSON_KIND_HEX]; repeated bytes parents = 3 [(asc.v1.json) = JSON_KIND_HEX]; Signature author = 4;
  Signature committer = 5; bytes message = 6 [(asc.v1.json) = JSON_KIND_TEXT]; uint32 gen = 7;
  bytes change = 8 [(asc.v1.json) = JSON_KIND_CHANGE]; DiffStat stats = 9; bytes meta = 10 [(asc.v1.json) = JSON_KIND_DATA]; }
message LogResponse { repeated LogEntry entries = 1; uint64 count = 2; string next_page_token = 3;
  bool truncated = 4; string resume_token = 5; }   // truncated: the scan budget ran out
message MergeBaseRequest { RepoRef repo = 1; bytes a = 2 [(asc.v1.json) = JSON_KIND_HEX]; repeated bytes b = 3 [(asc.v1.json) = JSON_KIND_HEX]; bool all = 4; }
message MergeBaseResponse { repeated bytes bases = 1 [(asc.v1.json) = JSON_KIND_HEX]; }
message IsAncestorRequest { RepoRef repo = 1; bytes ancestor = 2 [(asc.v1.json) = JSON_KIND_HEX]; bytes descendant = 3 [(asc.v1.json) = JSON_KIND_HEX]; }
message IsAncestorResponse { bool result = 1; }

enum DiffFormat { DIFF_FORMAT_NAMES = 0; DIFF_FORMAT_STATUS = 1; DIFF_FORMAT_STAT = 2; DIFF_FORMAT_NUMSTAT = 3;
                  DIFF_FORMAT_PATCH = 4; DIFF_FORMAT_RAW = 5; }
message DiffRequest { RepoRef repo = 1; string base = 2; string head = 3; bool merge_base = 4;
  repeated string paths = 5; DiffFormat format = 6; bool renames = 7; uint32 context = 8; bool binary = 9;
  bool null_terminated = 10; uint32 max_files = 11; }
message PathChange { bytes path = 1 [(asc.v1.json) = JSON_KIND_PATH]; string status = 2; bytes old_path = 3 [(asc.v1.json) = JSON_KIND_PATH]; uint32 old_mode = 4; uint32 new_mode = 5;
  bytes old_git = 6 [(asc.v1.json) = JSON_KIND_HEX]; bytes new_git = 7 [(asc.v1.json) = JSON_KIND_HEX]; bytes old_id = 8 [(asc.v1.json) = JSON_KIND_HEX]; bytes new_id = 9 [(asc.v1.json) = JSON_KIND_HEX]; uint64 old_size = 10; uint64 new_size = 11;
  uint32 similarity = 12; }
message DiffResponse { repeated PathChange changes = 1; bytes text = 2 [(asc.v1.json) = JSON_KIND_TEXT]; bool truncated = 3; }  // text = git-format output

message BlameRequest { RepoRef repo = 1; string rev = 2; bytes path = 3 [(asc.v1.json) = JSON_KIND_PATH]; uint32 start_line = 4; uint32 end_line = 5;
  bool reverse = 6; }
message BlameHunk { bytes origin = 1 [(asc.v1.json) = JSON_KIND_HEX]; bytes orig_path = 2 [(asc.v1.json) = JSON_KIND_PATH]; uint32 orig_start = 3; uint32 start = 4; uint32 len = 5; }
message BlameResponse { repeated BlameHunk hunks = 1; repeated LogEntry commits = 2;
  repeated ReviewState reviews = 3; }   // parallel to commits
message LastCommitsRequest { RepoRef repo = 1; string rev = 2; bytes dir = 3 [(asc.v1.json) = JSON_KIND_PATH]; repeated bytes names = 4 [(asc.v1.json) = JSON_KIND_PATH]; }
message LastCommitsResponse { map<string, LogEntry> by_name = 1; }

message ReadChangesetRequest { RepoRef repo = 1; string rev = 2; }
message ReadChangesetResponse { LogEntry header = 1; bytes root_tree = 2 [(asc.v1.json) = JSON_KIND_HEX]; bytes root_git = 3 [(asc.v1.json) = JSON_KIND_HEX]; repeated PathChange changes = 4;
  map<string, bytes> extra = 5 [(asc.v1.json) = JSON_KIND_DATA]; bytes raw_git_commit = 6 [(asc.v1.json) = JSON_KIND_DATA]; }
message ReadTreeRequest { RepoRef repo = 1; string rev = 2; bytes path = 3 [(asc.v1.json) = JSON_KIND_PATH]; bool recursive = 4; uint32 limit = 5;
  bytes after = 6 [(asc.v1.json) = JSON_KIND_PATH]; }
message TreeEntryInfo { bytes name = 1 [(asc.v1.json) = JSON_KIND_PATH]; bytes path = 2 [(asc.v1.json) = JSON_KIND_PATH]; uint32 mode = 3; bytes id = 4 [(asc.v1.json) = JSON_KIND_HEX]; bytes git = 5 [(asc.v1.json) = JSON_KIND_HEX]; uint64 size = 6;
  reserved 7, 8; }   // were lfs, lfs_size
message ReadTreeResponse { repeated TreeEntryInfo entries = 1; bytes tree_id = 2 [(asc.v1.json) = JSON_KIND_HEX]; bytes tree_git = 3 [(asc.v1.json) = JSON_KIND_HEX]; }
message ReadFileRequest { RepoRef repo = 1; oneof at { string rev_path = 2; bytes file_id = 3 [(asc.v1.json) = JSON_KIND_HEX]; } uint64 offset = 4;
  uint64 length = 5; reserved 6; }   // was resolve_lfs
message ReadFileResponse { bytes data = 1 [(asc.v1.json) = JSON_KIND_DATA]; uint64 total_size = 2; }
message StatRequest { RepoRef repo = 1; string rev = 2; repeated bytes paths = 3 [(asc.v1.json) = JSON_KIND_PATH]; repeated ObjKey objects = 4; }
message StatResponse { repeated TreeEntryInfo entries = 1; repeated bool exists = 2; }
message CheckAttrRequest { RepoRef repo = 1; string rev = 2; repeated bytes paths = 3 [(asc.v1.json) = JSON_KIND_PATH]; repeated string names = 4; }
message AttrValues { map<string, string> values = 1; }
message CheckAttrResponse { repeated AttrValues per_path = 1; }
message GrepRequest { RepoRef repo = 1; string rev = 2; string pattern = 3; bool fixed = 4; bool ignore_case = 5;
  repeated string paths = 6; uint32 max_results = 7; }
message GrepMatch { bytes path = 1 [(asc.v1.json) = JSON_KIND_PATH]; uint32 line = 2; bytes text = 3 [(asc.v1.json) = JSON_KIND_TEXT]; }
message GrepResponse { repeated GrepMatch matches = 1; }
message ArchiveRequest { RepoRef repo = 1; string rev = 2; string format = 3; string prefix = 4; repeated string paths = 5; }
message ArchiveResponse { bytes data = 1 [(asc.v1.json) = JSON_KIND_DATA]; }

message FileOp { bytes path = 1 [(asc.v1.json) = JSON_KIND_PATH];
  oneof op { bytes put_content = 2 [(asc.v1.json) = JSON_KIND_DATA]; bytes put_file_id = 3 [(asc.v1.json) = JSON_KIND_HEX]; bool delete = 4; bytes move_from = 5 [(asc.v1.json) = JSON_KIND_PATH]; }
  uint32 mode = 6; }
message CommitRequest { RepoRef repo = 1; string parent = 2; repeated FileOp ops = 3; bytes message = 4 [(asc.v1.json) = JSON_KIND_TEXT];
  Signature author = 5; Signature committer = 6; string update_ref = 7; RefTarget expect = 8; bool sign = 9; }
message CommitResponse { bytes id = 1 [(asc.v1.json) = JSON_KIND_HEX]; bytes git = 2 [(asc.v1.json) = JSON_KIND_HEX]; }
enum MergeStyle { MERGE_STYLE_MERGE = 0; MERGE_STYLE_SQUASH = 1; MERGE_STYLE_REBASE = 2; MERGE_STYLE_REBASE_MERGE = 3;
  MERGE_STYLE_FAST_FORWARD_ONLY = 4; }
message MergeRequest { RepoRef repo = 1; string base = 2; string head = 3; RepoRef head_repo = 4; MergeStyle style = 5;
  bytes message = 6 [(asc.v1.json) = JSON_KIND_TEXT]; Signature author = 7; Signature committer = 8; bool dry_run = 9; string update_ref = 10;
  repeated string protected_globs = 11; bool sign = 12; }
enum ConflictKind { CONFLICT_KIND_CONTENT = 0; CONFLICT_KIND_ADD_ADD = 1; CONFLICT_KIND_MODIFY_DELETE = 2;
  CONFLICT_KIND_FILE_DIR = 3; CONFLICT_KIND_CASE_FOLD = 4; CONFLICT_KIND_BINARY = 5; }
message Conflict { bytes changeset = 1 [(asc.v1.json) = JSON_KIND_HEX]; bytes path = 2 [(asc.v1.json) = JSON_KIND_PATH]; ConflictKind kind = 3; bytes base_id = 4 [(asc.v1.json) = JSON_KIND_HEX]; bytes ours_id = 5 [(asc.v1.json) = JSON_KIND_HEX];
  bytes theirs_id = 6 [(asc.v1.json) = JSON_KIND_HEX]; bytes marked_id = 7 [(asc.v1.json) = JSON_KIND_HEX]; }                 // marked_id: FileId of the diff3-style marked result (§8.11)
message MergeResponse { bytes result = 1 [(asc.v1.json) = JSON_KIND_HEX]; repeated bytes conflicts = 2 [(asc.v1.json) = JSON_KIND_PATH]; repeated bytes changed_protected = 3 [(asc.v1.json) = JSON_KIND_PATH];
  bool is_empty = 4; repeated Rewrite rewritten = 5; repeated Conflict conflict_details = 6; }
enum ApplyMode { APPLY_MODE_CHERRY_PICK = 0; APPLY_MODE_REVERT = 1; APPLY_MODE_PATCH = 2; }
message ApplyRequest { RepoRef repo = 1; string onto = 2; string changeset = 3; bytes patch = 4 [(asc.v1.json) = JSON_KIND_TEXT]; ApplyMode mode = 5;
  bytes message = 6 [(asc.v1.json) = JSON_KIND_TEXT]; Signature author = 7; Signature committer = 8; string update_ref = 9; }
message ApplyResponse { bytes result = 1 [(asc.v1.json) = JSON_KIND_HEX]; repeated bytes conflicts = 2 [(asc.v1.json) = JSON_KIND_PATH]; repeated Conflict conflict_details = 3; }
message CopyClosureRequest { RepoRef from = 1; RepoRef to = 2; repeated bytes changesets = 3 [(asc.v1.json) = JSON_KIND_HEX]; }
message CopyClosureResponse { uint64 copied = 1; }

message RepoAdminRequest { RepoRef repo = 1;
  oneof op { InitOp init = 2; ForkOp fork = 3; bool delete = 4; string rename_to = 5; bool size = 6; bool verify = 7;
    string set_default_branch = 8; /* trunk: the branch the gate protects (secret scan, path rules, review) */ } }
message InitOp { string default_branch = 1; bool windows_safe = 2; string mode = 3; /* "primary"|"mirror" */
  string mirror_url = 4; repeated string land_branches = 5; }
message ForkOp { RepoRef from = 1; }
message RepoAdminResponse { uint64 logical_size = 1; uint64 unique_size = 2; string report = 3; }

message GitRefUpdate { string name = 1; bytes old_git = 2 [(asc.v1.json) = JSON_KIND_HEX]; bytes new_git = 3 [(asc.v1.json) = JSON_KIND_HEX]; }
message ImportGitPushRequest { RepoRef repo = 1; string git_dir = 2; string object_dir = 3;
  repeated string alternate_dirs = 4; repeated GitRefUpdate updates = 5; int64 pusher_id = 6; }
message ImportGitPushResponse { repeated RefResult results = 1; }

message IngestRequest { RepoRef repo = 1; repeated bytes changesets = 2 [(asc.v1.json) = JSON_KIND_HEX]; }
message IngestResponse { repeated bytes ingested = 1 [(asc.v1.json) = JSON_KIND_HEX]; }
message FindLandingRequest { RepoRef repo = 1; bytes changeset = 2 [(asc.v1.json) = JSON_KIND_HEX]; string ref = 3; }       // asc or git id
message FindLandingResponse { bool found = 1; bytes landed_as = 2 [(asc.v1.json) = JSON_KIND_HEX]; uint64 ref_log_seq = 3; int64 at = 4;
  string actor = 5; string via = 6; }
enum ChangeClass { CHANGE_CLASS_RENAME_ONLY = 0; CHANGE_CLASS_MODE_ONLY = 1; CHANGE_CLASS_WHITESPACE_ONLY = 2;
  CHANGE_CLASS_COMMENT_ONLY = 3; CHANGE_CLASS_DOCS = 4; CHANGE_CLASS_GENERATED = 5; CHANGE_CLASS_LOCKFILE = 6;
  CHANGE_CLASS_TEST = 7; CHANGE_CLASS_LOGIC = 8; }
message ClassifyRequest { RepoRef repo = 1; string base = 2; string head = 3; bool merge_base = 4; }
message FileClass { bytes path = 1 [(asc.v1.json) = JSON_KIND_PATH]; ChangeClass class = 2; }
message ClassifyResponse { repeated FileClass files = 1; ChangeClass overall = 2; }
message Resolution { bytes changeset = 1 [(asc.v1.json) = JSON_KIND_HEX]; bytes path = 2 [(asc.v1.json) = JSON_KIND_PATH]; FileOp op = 3; }
message RebaseRequest { RepoRef repo = 1; RepoRef head_repo = 2; string base = 3; string head = 4; string onto = 5;
  repeated Resolution resolutions = 6; bool dry_run = 7; string update_ref = 8; RefTarget expect = 9; UpdateMode mode = 10; }
message RebaseResponse { bytes result = 1 [(asc.v1.json) = JSON_KIND_HEX]; repeated Rewrite rewritten = 2; repeated Conflict conflicts = 3; }

// Detail attached to a failed call's gRPC status (§7). `code` is one of the documented code strings.
message ErrorDetail { string code = 1; repeated string paths = 2; bytes actual = 3 [(asc.v1.json) = JSON_KIND_HEX]; repeated Conflict conflicts = 4; }

// Stacked changes and history insight (SPEC §20.5, §20.6; amendment made by C17).
// ErrorDetail.code also carries CHANGE_DIVERGED, CHANGE_FROZEN, LAND_NEEDS_CONTENT_MERGE and CHANGE_NOT_ALLOWED.
message ReviewState { string host = 1; uint64 number = 2; string url = 3; string state = 4; bool draft = 5;
  uint32 approvals = 6; string checks = 7; string queue = 8; uint32 reviewed_version = 9; int64 updated = 10; }
message FileStat { bytes path = 1 [(asc.v1.json) = JSON_KIND_PATH]; uint32 added = 2; uint32 removed = 3; bool binary = 4; }
message DiffStat { repeated FileStat files = 1; }
enum GraphPreset { GRAPH_PRESET_ALL = 0; GRAPH_PRESET_CURRENT = 1; GRAPH_PRESET_SMART = 2; GRAPH_PRESET_STACK = 3; }
message CommitGraphRequest { RepoRef repo = 1; repeated string include = 2; repeated string exclude = 3; GraphPreset preset = 4;
  bool lanes = 5; bool stats = 6; uint32 limit = 7; string page_token = 8; }
message GraphEdge { uint32 to_column = 1; bytes parent = 2 [(asc.v1.json) = JSON_KIND_HEX]; }
message GraphRow { LogEntry entry = 1; repeated string refs = 2; uint32 column = 3; repeated GraphEdge edges = 4;
  bool overflow = 5; ReviewState review = 6; bool wip = 7; string ws_id = 8; }
// A ref and the row it labels in the first page (SPEC §24.8.2, A2).
message RefMarker { string name = 1; uint64 row = 2; }
// total and ref_markers are set on the first page only and only when cheap: total is the row count of the whole
// result, row is the zero-based index of the labelled row in the first page. 0 and [] mean "not known".
message CommitGraphResponse { repeated GraphRow rows = 1; string next_page_token = 2; uint64 total = 3;
  repeated RefMarker ref_markers = 4; }
message LineHistoryRequest { RepoRef repo = 1; string rev = 2; bytes path = 3 [(asc.v1.json) = JSON_KIND_PATH]; uint32 start_line = 4; uint32 end_line = 5;
  uint32 limit = 6; uint32 scan_budget = 7; string resume_token = 8; }
message CompareRequest { RepoRef repo = 1; string a = 2; string b = 3; bool three_dot = 4; uint32 limit = 5;
  string ahead_page_token = 6; string behind_page_token = 7; }
message CompareResponse { bytes merge_base = 1 [(asc.v1.json) = JSON_KIND_HEX]; uint64 ahead = 2; uint64 behind = 3; repeated LogEntry ahead_entries = 4;
  repeated LogEntry behind_entries = 5; string ahead_next = 6; string behind_next = 7; repeated PathChange files = 8; }
message Autolink { string prefix = 1; string url = 2; }
message RepoConfigRequest { RepoRef repo = 1; string rev = 2; }
// Commit cloud and branchless additions (SPEC §21.3.5; follow-up B07). VersionResponse.features also lists
// "cloud.v1" and "branchless.v1"; ErrorDetail.code also carries VERSION_CONFLICT, CLOUD_HEADS_LIMIT,
// CLOUD_WORKSPACES_LIMIT, USER_REFS_LIMIT, QUOTA_EXCEEDED and REF_NOT_SHARED. visibility is "private", "internal" or "public".
message RepoConfigResponse { repeated Autolink autolinks = 1; bool branchless = 2; bool cloud = 3;
  repeated string shared_refs = 4; string visibility = 5; }
// Ref-update stream (SPEC §21.3.8, U76). patterns: at most 8 globs of at most 128 bytes, `*` matches any run; a name without the
// refs/ prefix means refs/heads/<name>; empty means master and release/*. resume: an opaque cursor from an earlier RefEvent; empty
// starts at the newest update. The server sends only refs the caller may read; another user's draft refs never appear.
message WatchRefsRequest { RepoRef repo = 1; repeated string patterns = 2; bytes resume = 3 [(asc.v1.json) = JSON_KIND_HEX]; }
message RefEvent { string name = 1; RefTarget old = 2; RefTarget new = 3; bytes resume = 4 [(asc.v1.json) = JSON_KIND_HEX]; }   // old/new absent: ref created/deleted

// Repository policy as code (`.asc/policy.toml` on the trunk tip). `GetPolicy` is read-only: it shows the
// policy the server enforces, so a UI can say who can write where. Only a maintainer named by the policy can change the file, and
// only through an ordinary land. Advertised as Version.features "policy.v1". Subjects are `*`, `<kind>:<glob>` (kinds user, agent,
// deploy, ci, host) or `role:<name>`. `paths` (at most 64) are repository paths to evaluate for the caller: the answer says whether
// the caller's write to each would pass the path rules, agent scope and denied paths (not approvals or checks). ErrorDetail.code
// also carries POLICY_DENIED (PERMISSION_DENIED): the update broke the policy; `paths[0]` is the reason.
message GetPolicyRequest { RepoRef repo = 1; repeated bytes paths = 2 [(asc.v1.json) = JSON_KIND_PATH]; }
message PolicyRole { string name = 1; repeated string members = 2; }
message PolicyPathRule { string glob = 1; repeated string write = 2; }
message PolicyTrunk { string branch = 1; uint32 require_approvals = 2; repeated string require_checks = 3; bool allow_force = 4;
  bool require_signed = 5; }   // changes must carry a valid signature ([signing] require_signed)
message PolicyAgents { repeated string default_scope = 1; repeated string denied_paths = 2;
  uint32 max_changes_per_run = 3; uint32 max_paths_per_run = 4;   // 0 = no limit
  bool enabled = 5; uint32 max_runtime_seconds = 6; uint64 max_tokens = 7; uint64 max_cost_micro_usd = 8; }   // 0 = no limit
// `[review]`: who may approve and when an approval stands.
message PolicyReview { bool author_may_approve = 1; bool human_approval = 2; bool keep_approvals_on_restack = 3; }
// `[merge]` besides the strategy.
message PolicyMerge { bool queue = 1; bool revalidate = 2; uint32 batch = 3; bool post_merge_checks = 4; }
// `[stacks]`; 0 in `max_depth` and `cleanup_days` means no limit and the server's setting.
message PolicyStacks { uint32 max_depth = 1; uint32 cleanup_days = 2; bool restack_on_main_move = 3; bool collaborators_may_push = 4; }
message PolicyDecision { bytes path = 1 [(asc.v1.json) = JSON_KIND_PATH]; bool allowed = 2; string reason = 3; }
message GetPolicyResponse {
  bool present = 1;          // trunk carries a policy file
  string error = 2;          // present but unusable: the server then refuses every update of trunk except one that repairs the file
  uint32 version = 3;
  bytes source = 4 [(asc.v1.json) = JSON_KIND_HEX];   // the trunk changeset the policy was read from
  string principal_kind = 5; // how the policy classifies the caller: user, agent, deploy, ci, host or ""
  bool maintainer = 6;       // the caller is a maintainer
  repeated PolicyRole roles = 7;
  PolicyTrunk trunk = 8;
  repeated PolicyPathRule paths = 9;
  PolicyAgents agents = 10;
  string merge_strategy = 11;                 // rebase, rebase-disjoint or fast-forward
  repeated PolicyDecision decisions = 12;     // one per requested path, in order
  PolicyReview review = 13;
  PolicyMerge merge = 14;
  PolicyStacks stacks = 15;
}
