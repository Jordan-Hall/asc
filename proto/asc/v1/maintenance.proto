syntax = "proto3";
package asc.v1;

// Read-only maintenance of the server (SPEC §14.5). While it is on, every write is refused with UNAVAILABLE and the notice's
// message: no ref moves (pushes, lands, cloud updates) and no object is accepted. Reads go on. The hub shows the same notice on
// its 503 page and switches the server with SetMaintenance from its Admin Maintenance board; an operator can switch it without
// the hub with `asc serve admin maintenance on|off`.
//
// The setting is one database row, so every node of a cluster follows it: each node reads it at start and every 5 seconds.
// `until` is when the operator expects to be done; it is shown, never acted on, so maintenance ends only when switched off.
//
// Every call is for the site administrator: the host service with an `instance` claim of role admin, or the host service's own
// credential. Any other caller gets PERMISSION_DENIED. SetMaintenance needs `x-asc-op-id` and is written to the audit log as
// "server.maintenance.updated". Advertised as Version.features "maintenance.v1".
//
// CheckHealth is the part of the hub's health page that only this server can answer: whether its object store takes a
// write, gives it back and deletes it, whether its own signing key still signs, and its clock. It is advertised as
// Version.features "health.v1". The server makes the probes at most once every 5 seconds; a call in between gets the
// last answer again.
service Maintenance {
  rpc GetMaintenance(GetMaintenanceRequest) returns (GetMaintenanceResponse);   // site admin
  rpc SetMaintenance(SetMaintenanceRequest) returns (SetMaintenanceResponse);   // site admin; mutating
  rpc CheckHealth(CheckHealthRequest) returns (CheckHealthResponse);            // site admin; probes, rate limited
}

enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_OK = 1;
  HEALTH_STATE_FAILED = 2;
  HEALTH_STATE_NOT_CONFIGURED = 3;   // the server has no such thing to check (no signing key is set)
}

message HealthProbe {
  HealthState state = 1;
  uint32 millis = 2;   // how long the probe took
  string detail = 3;   // why it failed, a fixed phrase (never a provider's own text); empty when it passed
}

message CheckHealthRequest {}
message CheckHealthResponse {
  HealthProbe object_store = 1;   // write a random object under `<root>/.asc-probe/`, read it back, compare, delete it
  HealthProbe server_key = 2;     // sign a fixed message with the key of signing.server_key_file and verify the signature
  string server_key_fingerprint = 3;
  int64 checked_at_ms = 4;        // the server's clock (unix milliseconds) when it made the probes
  int64 now_ms = 5;               // the server's clock when it answered, for the caller to compare with its own
}

message MaintenanceState {
  bool on = 1;
  string message = 2;          // <= 500 characters, no control characters; empty = a generic notice
  int64 until = 3;             // unix seconds; 0 = not said
  string version = 4;          // the version being upgraded to, [A-Za-z0-9._+-]{0,64}; empty = not an upgrade
  int64 updated = 5;           // unix seconds of the last change; 0 = never set
  string updated_by = 6;       // the principal id of the person who changed it, or "operator" for the admin CLI
  bool restore_staged = 7;     // a staged restore also holds the server read-only until it restarts (docs/runbooks/backup.md)
}

message GetMaintenanceRequest {}
message GetMaintenanceResponse { MaintenanceState state = 1; }

// Replaces the notice. Off keeps the message, until and version for the next time it is switched on.
message SetMaintenanceRequest {
  bool on = 1;
  string message = 2;
  int64 until = 3;             // must not be in the past when on
  string version = 4;
}
message SetMaintenanceResponse { MaintenanceState state = 1; }
