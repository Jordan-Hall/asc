syntax = "proto3";
package asc.v1;

import "asc/v1/options.proto";
import "asc/v1/repo.proto";

// Secret scanning (build-out feature "secret-scan"; docs/BUILDOUT.md). Every update that lands changes on a protected
// branch is scanned before the ref moves, and a repository admin can scan any revision on demand. A finding never carries
// the secret: `preview` keeps at most the first 2 characters and `fingerprint` is a keyed hash that is stable per
// (repository, rule, value) and cannot be reversed. Rules are the built-in catalogue plus `[secrets.rules.<id>]` of the policy file;
// `[secrets]` of the policy also holds `block_on_push` (default true) and `allow_paths`. Advertised as
// Version.features "secretscan.v1". ErrorDetail.code also carries SECRET_DETECTED (FAILED_PRECONDITION): the push is refused,
// `paths` lists "<path>:<line> <rule id>" for each finding, never the value.
service SecretScan {
  rpc ListRules(ListSecretRulesRequest) returns (ListSecretRulesResponse);   // repo read
  rpc Scan(ScanSecretsRequest) returns (ScanSecretsResponse);                // repo admin; expensive; records findings
  rpc ListFindings(ListSecretFindingsRequest) returns (ListSecretFindingsResponse);   // repo admin; paged
  rpc UpdateFinding(UpdateSecretFindingRequest) returns (UpdateSecretFindingResponse);   // repo admin; mutating, x-asc-op-id
  rpc Check(CheckSecretsRequest) returns (CheckSecretsResponse);             // repo write; expensive; records nothing: would the push gate refuse this?
}

enum SecretSeverity {
  SECRET_SEVERITY_UNSPECIFIED = 0;
  SECRET_SEVERITY_LOW = 1;
  SECRET_SEVERITY_MEDIUM = 2;
  SECRET_SEVERITY_HIGH = 3;
  SECRET_SEVERITY_CRITICAL = 4;
}

enum SecretFindingState {
  SECRET_FINDING_STATE_UNSPECIFIED = 0;   // in a request: any state
  SECRET_FINDING_STATE_OPEN = 1;
  SECRET_FINDING_STATE_REVOKED = 2;        // the secret was rotated or revoked at its issuer
  SECRET_FINDING_STATE_FALSE_POSITIVE = 3;
  SECRET_FINDING_STATE_ACCEPTED_RISK = 4;
}

message SecretRule {
  string id = 1;                // "aws-access-key", "private-key-block", "custom.<name>"
  string name = 2;
  string description = 3;
  SecretSeverity severity = 4;
  bool builtin = 5;
  bool enabled = 6;
  string detector = 7;          // "regex", "prefix" or "entropy"
}

message ListSecretRulesRequest {
  RepoRef repo = 1;
}
message ListSecretRulesResponse {
  repeated SecretRule rules = 1;
  bool block_on_push = 2;
  repeated string allow_paths = 3;
}

// What `head` adds to `base`.
message SecretScanRange {
  string base = 1;
  string head = 2;
}

// Exactly one of `rev` (the whole tree), `change` (what its newest version adds) and `range` names what to scan. `paths`
// narrows the scan. At most 10,000 files and 16 MiB of text per call; more is `truncated`.
message ScanSecretsRequest {
  RepoRef repo = 1;
  oneof at {
    string rev = 2;
    bytes change = 3 [(asc.v1.json) = JSON_KIND_CHANGE];
    SecretScanRange range = 4;
  }
  repeated string paths = 5;
}

// What `Scan` takes, for a person who is about to open a change: the findings are returned and not recorded, and the call
// needs write access, not administration. `blocks` is what the push gate would do with them under the policy in force:
// true when `[secrets] enabled` and `block_on_push` hold and the scan found a secret or stopped before reading every file.
message CheckSecretsRequest {
  RepoRef repo = 1;
  oneof at {
    string rev = 2;
    bytes change = 3 [(asc.v1.json) = JSON_KIND_CHANGE];
    SecretScanRange range = 4;
  }
  repeated string paths = 5;
}
message CheckSecretsResponse {
  repeated SecretFinding findings = 1;   // `id` is 0 and `state` OPEN: nothing is stored
  uint32 files_scanned = 2;
  bool truncated = 3;
  bool blocks = 4;
  bool block_on_push = 5;
}

message SecretFinding {
  uint64 id = 1;
  string rule_id = 2;
  SecretSeverity severity = 3;
  SecretFindingState state = 4;
  bytes path = 5 [(asc.v1.json) = JSON_KIND_PATH];
  uint32 line = 6;
  uint32 column = 7;
  bytes changeset = 8 [(asc.v1.json) = JSON_KIND_HEX];   // the first changeset that contained it
  bytes change = 9 [(asc.v1.json) = JSON_KIND_CHANGE];
  string fingerprint = 10;
  string preview = 11;          // masked: at most 2 leading characters, then "***"
  int64 first_seen = 12;
  int64 last_seen = 13;
  string resolved_by = 14;
  int64 resolved_at = 15;
  string note = 16;
}

message ScanSecretsResponse {
  repeated SecretFinding findings = 1;
  uint32 files_scanned = 2;
  bool truncated = 3;
}

// Newest first. `limit` 0 means 50, at most 200.
message ListSecretFindingsRequest {
  RepoRef repo = 1;
  repeated SecretFindingState states = 2;
  repeated string rule_ids = 3;
  SecretSeverity min_severity = 4;
  uint32 limit = 5;
  string page_token = 6;
}
message ListSecretFindingsResponse {
  repeated SecretFinding findings = 1;
  string next_page_token = 2;
  map<string, uint32> counts_by_state = 3;   // key: the enum name without the prefix, lower case ("open")
}

// `state` OPEN reopens. `note` is at most 1,024 bytes.
message UpdateSecretFindingRequest {
  RepoRef repo = 1;
  uint64 id = 2;
  SecretFindingState state = 3;
  string note = 4;
}
message UpdateSecretFindingResponse {
  SecretFinding finding = 1;
}
