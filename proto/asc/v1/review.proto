syntax = "proto3";
package asc.v1;

import "asc/v1/options.proto";
import "asc/v1/repo.proto";

// Calls made by the host service (the hub) for a signed-in person carry that person's forwarded claim (x-asc-forwarded-*,
// subject = the repository): the call then acts as the person, within the claim's role (read, write or admin) and no more,
// and the audit events name the person as the actor and the host service as the relay. A claim that does not verify, or
// whose role is too small, is PERMISSION_DENIED. This holds for every RPC of this file.
// Review comment threads on a change, stored by asc itself so every client sees the same threads whichever forge,
// if any, sits in front of the server. Advertised as Version.features "review.v1". Reads need repo read; comments
// and resolving need repo read and a user identity (comments carry the author's handle); RequestReview needs repo write.
service Review {
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);       // cheap, paged
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);          // mutating, x-asc-op-id
  rpc ResolveThread(ResolveThreadRequest) returns (ResolveThreadResponse); // idempotent, no x-asc-op-id
  rpc RequestReview(RequestReviewRequest) returns (RequestReviewResponse); // idempotent; feeds the inbox
  rpc GetBrief(GetBriefRequest) returns (GetBriefResponse);                       // repo read; brief, size, risk, provenance, approvals, gate data
  rpc SetBrief(SetBriefRequest) returns (SetBriefResponse);                       // the author or repo write; idempotent
  rpc RecordApproval(RecordApprovalRequest) returns (RecordApprovalResponse);     // repo write; the host reports the verdict of a person; idempotent
  rpc CompareVersions(CompareVersionsRequest) returns (CompareVersionsResponse);  // repo read; files changed or unchanged between two versions
  rpc PrepareSuggestion(PrepareSuggestionRequest) returns (PrepareSuggestionResponse);   // repo write; the file with the suggestion applied
  rpc MarkSuggestionApplied(MarkSuggestionAppliedRequest) returns (MarkSuggestionAppliedResponse);   // repo write; records the version that applied it
  rpc SuggestReviewers(SuggestReviewersRequest) returns (SuggestReviewersResponse);      // repo read
  rpc RecordGateDecision(RecordGateDecisionRequest) returns (RecordGateDecisionResponse);   // repo admin (the host); idempotent
  rpc GetGateStats(GetGateStatsRequest) returns (GetGateStatsResponse);           // repo read; counts, per day, per rule
  rpc GrantOverride(GrantOverrideRequest) returns (GrantOverrideResponse);        // repo admin; reason required; audited; x-asc-op-id
  rpc RevokeOverride(RevokeOverrideRequest) returns (RevokeOverrideResponse);     // repo admin; idempotent
  rpc ListOverrides(ListOverridesRequest) returns (ListOverridesResponse);        // repo read; paged
  rpc HunkContext(HunkContextRequest) returns (HunkContextResponse);              // repo read; the definitions around the lines a hunk starts at
  rpc GetConflicts(GetChangeConflictsRequest) returns (GetChangeConflictsResponse);   // repo read; expensive; the conflict hunks of a change with its target, both sides
  rpc DraftContext(DraftContextRequest) returns (DraftContextResponse);           // repo read; what a draft of a new change is written from: messages, files, size, risk
}

enum ThreadStatus {
  THREAD_STATUS_UNSPECIFIED = 0;   // in a request: any status
  THREAD_STATUS_OPEN = 1;
  THREAD_STATUS_RESOLVED = 2;
}

enum DiffSide {
  DIFF_SIDE_UNSPECIFIED = 0;
  DIFF_SIDE_OLD = 1;   // the parent side of the change's diff
  DIFF_SIDE_NEW = 2;   // the change's own side
}

// Where a thread sits. An empty `path` is a thread on the change as a whole. Lines are 1-based and inclusive;
// `end_line` 0 means `start_line`.
message ThreadAnchor {
  bytes path = 1 [(asc.v1.json) = JSON_KIND_PATH];
  uint32 version = 2;
  DiffSide side = 3;
  uint32 start_line = 4;
  uint32 end_line = 5;
}

message ReviewComment {
  uint64 id = 1;
  string author = 2;
  string body = 3;
  int64 created = 4;
  string external_id = 5;   // the host's own id of the comment, when it mirrored it here; empty otherwise
  string suggestion = 6;    // replacement text for the lines of the thread; empty when the comment suggests nothing
  uint32 applied_version = 7;   // the version that applied the suggestion, 0 while it is not applied
  string applied_by = 8;
  uint64 author_id = 9;      // the hub's immutable id of the author; 0 when the caller had none (a token); `author` can be renamed
}

message ReviewThread {
  uint64 id = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
  ThreadAnchor anchor = 3;
  ThreadStatus status = 4;
  string opened_by = 5;
  int64 created = 6;
  int64 updated = 7;
  string resolved_by = 8;
  int64 resolved_at = 9;
  repeated ReviewComment comments = 10;
}

// `status` unspecified lists all; `version` 0 lists every version. Oldest thread first. `limit` 0 means 50, at most 200.
message ListThreadsRequest {
  RepoRef repo = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
  ThreadStatus status = 3;
  uint32 version = 4;
  uint32 limit = 5;
  string page_token = 6;
}
// `open_threads` counts every open thread of the change, whatever the filter.
message ListThreadsResponse {
  repeated ReviewThread threads = 1;
  string next_page_token = 2;
  uint32 open_threads = 3;
}

// `thread_id` 0 starts a thread at `anchor` (version 0 = the newest); otherwise the comment is added to that thread
// and `anchor` is ignored. `body` is 1 to 65536 bytes of UTF-8. A retried x-asc-op-id returns the first answer.
message AddCommentRequest {
  RepoRef repo = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
  uint64 thread_id = 3;
  ThreadAnchor anchor = 4;
  string body = 5;
  // The host's own id of the comment (at most 128 bytes of [A-Za-z0-9._:/-]). A comment mirrored twice under the same
  // id is stored once: the second call answers with the stored comment and thread and changes nothing. The id is
  // unique per repository, so it cannot name a comment of another change.
  string external_id = 6;
  // Replacement text for the lines of the thread (at most 64 KiB; the thread must be on lines). Applying it is PrepareSuggestion and
  // MarkSuggestionApplied.
  string suggestion = 7;
}
message AddCommentResponse {
  ReviewThread thread = 1;
  uint64 comment_id = 2;
}

// Whoever has repo write, the change's author and the thread's opener may resolve or reopen a thread.
message ResolveThreadRequest {
  RepoRef repo = 1;
  uint64 thread_id = 2;
  bool resolved = 3;
}
message ResolveThreadResponse {
  ReviewThread thread = 1;
}

// `add` and `remove` are user handles (at most 16 each). Adding a pending request again changes nothing; adding a
// finished one asks again.
message RequestReviewRequest {
  RepoRef repo = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
  repeated string add = 3;
  repeated string remove = 4;
}
message ReviewRequestInfo {
  string reviewer = 1;
  string requested_by = 2;
  int64 requested_at = 3;
  int64 done_at = 4;   // 0 while pending
}
message RequestReviewResponse {
  repeated ReviewRequestInfo requests = 1;
}

// ---------------------------------------------------------------------------------------------------- brief, approvals, suggestions
//
// Authorisation of the calls below, as everywhere in this file: reads need repo read, writes need repo write (SetBrief: the author
// of the change or a writer; RecordApproval: the claim names the reviewer, who needs repo write to approve). A change of another
// repository is NOT_FOUND. All of them are additive.

message WhereToLook {
  bytes path = 1 [(asc.v1.json) = JSON_KIND_PATH];
  uint32 line = 2;                       // 1-based; 0 for the file as a whole
  string note = 3;
}
// The block the author writes: what changed, why, how, what could go wrong and where to look first.
message ReviewBrief {
  string what = 1;
  string why = 2;
  string how = 3;
  string risk_note = 4;
  repeated WhereToLook where_to_look = 5;
  string updated_by = 6;
  int64 updated = 7;
}
message ChangeFileStat {
  bytes path = 1 [(asc.v1.json) = JSON_KIND_PATH];
  uint32 added = 2;
  uint32 removed = 3;
  bool binary = 4;
}
enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  RISK_LEVEL_LOW = 1;
  RISK_LEVEL_MEDIUM = 2;
  RISK_LEVEL_HIGH = 3;
}
// The classifier is deterministic and path and size based; `reasons` says why, in words a reviewer can read.
message ChangeRisk {
  RiskLevel level = 1;
  repeated string reasons = 2;
}
// Where a change came from when an agent run made it ("How it was made").
message ChangeProvenance {
  uint64 run_id = 1;                     // 0 when no run made the change
  string agent = 2;
  string title = 3;
  string task = 4;
  string created_by = 5;
  string run_state = 6;
  uint32 tool_calls = 7;
  uint32 files_read = 8;
  uint32 versions = 9;                   // versions of this change
  repeated string paths = 10;            // the write scope of the run
  int64 started = 11;
  int64 finished = 12;
}
enum ApprovalState {
  APPROVAL_STATE_UNSPECIFIED = 0;
  APPROVAL_STATE_APPROVED = 1;
  APPROVAL_STATE_CHANGES_REQUESTED = 2;
  APPROVAL_STATE_DISMISSED = 3;
}
// One person's verdict on one version, and whether it still applies to the newest one: it does when the patch of every file the
// version changes is identical in the newest version (`carried`); otherwise `changed_files` names the files that differ.
message ApprovalInfo {
  string reviewer = 1;
  uint32 version = 2;
  ApprovalState state = 3;
  int64 at = 4;
  bool applies = 5;                      // still counts for the newest version
  bool carried = 6;                      // applies although the version is not the newest
  uint32 unchanged_files = 7;
  repeated bytes changed_files = 8 [(asc.v1.json) = JSON_KIND_PATH];
  uint64 reviewer_id = 9;                // the hub's immutable id of the reviewer; 0 when the caller had none
}
// What the policy gate card of the review page shows, as far as asc knows it. Checks and the rules of the policy are evaluated by
// Policy.Evaluate and Ci.ListRuns.
message ReviewGateData {
  uint32 open_threads = 1;
  uint32 total_threads = 2;
  uint32 pending_reviewers = 3;
  uint32 finished_reviewers = 4;
  uint32 approvals_current = 5;          // approvals that apply to the newest version, carried ones included
  uint32 approvals_carried = 6;
  uint32 changes_requested = 7;
}
message GetBriefRequest {
  RepoRef repo = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
}
message GetBriefResponse {
  ReviewBrief brief = 1;                 // empty fields when the author wrote none
  uint32 latest_version = 2;
  uint32 files = 3;
  uint32 added = 4;
  uint32 removed = 5;
  repeated ChangeFileStat file_stats = 6;   // at most 500
  bool stats_truncated = 7;
  ChangeRisk risk = 8;
  ChangeProvenance provenance = 9;
  repeated ApprovalInfo approvals = 10;
  ReviewGateData gate = 11;
}
// Replaces the brief. Each text is at most 8 KiB, at most 20 pointers. The author of the change (the actor of its first version) or
// anyone with repo write may write it.
message SetBriefRequest {
  RepoRef repo = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
  ReviewBrief brief = 3;
}
message SetBriefResponse {
  ReviewBrief brief = 1;
}
// The host (the hub) reports the verdict of a person on a version. The reviewer is the person of the claim; a person with only
// repo read cannot approve. A second verdict of the same person on the same version replaces the first. `version` 0 means the newest.
message RecordApprovalRequest {
  RepoRef repo = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
  uint32 version = 3;
  ApprovalState state = 4;
  // With state DISMISSED only: dismisses the verdicts of another reviewer instead of the caller's own (a maintainer
  // dismissing a review on the hub). The reviewer is named by login, by the hub's immutable user id or by both; a
  // caller without write is refused as for any verdict, and a reviewer with no verdict on the change is NOT_FOUND.
  // Every verdict of that reviewer on the change stops counting, whatever its version; the audit event names both people.
  string reviewer = 5;
  uint64 reviewer_id = 6;
}
message RecordApprovalResponse {
  repeated ApprovalInfo approvals = 1;
}
message CompareVersionsRequest {
  RepoRef repo = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
  uint32 from_version = 3;
  uint32 to_version = 4;                 // 0 means the newest
}
message VersionFile {
  bytes path = 1 [(asc.v1.json) = JSON_KIND_PATH];
  string state = 2;                      // changed, unchanged, added or removed (relative to `from_version`)
  uint32 added = 3;                      // lines added in `to_version`
  uint32 removed = 4;
}
message CompareVersionsResponse {
  repeated VersionFile files = 1;        // at most 2000
  uint32 changed = 2;
  uint32 unchanged = 3;
  uint32 added = 4;                      // lines added across the changed files
  uint32 removed = 5;
  repeated ApprovalInfo approvals = 6;   // the verdicts on `from_version` and whether they apply to `to_version`
  bool truncated = 7;
}
message PrepareSuggestionRequest {
  RepoRef repo = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
  uint64 thread_id = 3;
  uint64 comment_id = 4;
}
// The file as it would be with the suggestion applied. The host commits it as the next version of the change, then calls
// MarkSuggestionApplied. `stale` is true when the suggestion no longer fits (the thread is on an older version, the file or the lines
// are gone); `new_content` is empty then and `reason` says why.
message PrepareSuggestionResponse {
  bytes path = 1 [(asc.v1.json) = JSON_KIND_PATH];
  uint32 version = 2;
  uint32 latest_version = 3;
  bytes base_changeset = 4 [(asc.v1.json) = JSON_KIND_HEX];
  bytes new_content = 5 [(asc.v1.json) = JSON_KIND_DATA];
  uint32 start_line = 6;
  uint32 end_line = 7;
  bool stale = 8;
  string reason = 9;
}
message MarkSuggestionAppliedRequest {
  RepoRef repo = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
  uint64 thread_id = 3;
  uint64 comment_id = 4;
  uint32 version = 5;                    // the version the apply made; later than the one the thread is on, at most the newest
}
message MarkSuggestionAppliedResponse {
  ReviewThread thread = 1;
}
message SuggestReviewersRequest {
  RepoRef repo = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
  uint32 limit = 3;                      // 0 means 5, at most 20
}
message SuggestedReviewer {
  string handle = 1;
  bool is_agent = 2;
  uint32 reviews = 3;                    // finished reviews in this repository
  uint32 on_same_files = 4;              // threads they opened on the files this change touches
  string reason = 5;
}
message SuggestReviewersResponse {
  repeated SuggestedReviewer reviewers = 1;
}

// ---------------------------------------------------------------------------------------------------- gate statistics and overrides
//
// The policy gate itself is evaluated by the host (and by Policy.Evaluate). These calls keep its history so the gate board can show
// what it did: the host reports each evaluation of a version; asc counts. Reads need repo read; reporting needs repo admin; granting
// and revoking an override need repo admin (a maintainer), need a reason, are audited with the person and the relay, and are chained:
// each override carries the SHA-256 proof of the one before it, so a removed or edited row is visible.

message GateRuleResult {
  string rule = 1;                       // the rule as the gate names it ("two approvals", "checks green", ...), at most 120 bytes
  bool held = 2;                         // this rule held the change
}
message RecordGateDecisionRequest {
  RepoRef repo = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
  uint32 version = 3;                    // 0 means the newest
  repeated GateRuleResult rules = 4;     // at most 64
}
// The same version reported again replaces the rules; a version that held and passes later is cleared (the time to clear is counted).
message RecordGateDecisionResponse {
  bool passed = 1;
  bool first_time = 2;                   // it passed at its first evaluation
  bool cleared = 3;                      // it held before and passes now
}
message GetGateStatsRequest {
  RepoRef repo = 1;
  uint32 days = 2;                       // 0 means 30, at most 365
}
message GateDay {
  string day = 1;                        // YYYY-MM-DD, UTC
  uint32 checked = 2;
  uint32 held = 3;
}
message GateRuleCount {
  string rule = 1;
  uint32 checked = 2;
  uint32 held = 3;
}
message GetGateStatsResponse {
  uint32 checked = 1;                    // versions the gate looked at in the window
  uint32 passed_first_time = 2;
  uint32 held = 3;                       // versions that were held at least once
  uint32 held_open = 4;                  // still held
  uint32 held_cleared = 5;
  uint32 median_clear_seconds = 6;       // among the cleared
  repeated GateDay per_day = 7;          // every day of the window, ascending, zero days included
  repeated GateRuleCount per_rule = 8;   // busiest first
  uint32 overrides_active = 9;
  bool truncated = 10;                   // more than 20000 evaluations: the oldest were left out
}
message GateOverride {
  uint64 id = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
  string rule = 3;
  string reason = 4;
  string granted_by = 5;
  int64 granted_at = 6;
  string revoked_by = 7;
  int64 revoked_at = 8;                  // 0 while active
  bytes proof = 9 [(asc.v1.json) = JSON_KIND_HEX];   // SHA-256 over the previous proof and this row
  bytes prev = 10 [(asc.v1.json) = JSON_KIND_HEX];
}
message GrantOverrideRequest {
  RepoRef repo = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
  string rule = 3;                       // 1 to 120 bytes
  string reason = 4;                     // 1 to 500 bytes
}
message GrantOverrideResponse {
  GateOverride override = 1;
}
message RevokeOverrideRequest {
  RepoRef repo = 1;
  uint64 id = 2;
}
message RevokeOverrideResponse {
  GateOverride override = 1;
}
message ListOverridesRequest {
  RepoRef repo = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];   // empty: every change of the repository
  bool active_only = 3;
  uint32 limit = 4;                      // 0 means 50, at most 200
  string page_token = 5;
}
message ListOverridesResponse {
  repeated GateOverride overrides = 1;   // newest first
  string next_page_token = 2;
}

// ---------------------------------------------------------------------------------------------------- hunk context

// For each line a hunk starts at, the chain of definitions around it, outermost first: `["UserList", "@for (const user of users)",
// "@if (user.bio)"]` in a TSRX file, `["Parser", "parse"]` in Rust. Repo read. `version` 0 means the newest. At most 200 lines. A
// file with no grammar answers empty chains. (Git's own hunk header rule stays in `asc diff`, so its output matches git's.)
message HunkContextRequest {
  RepoRef repo = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
  uint32 version = 3;
  bytes path = 4 [(asc.v1.json) = JSON_KIND_PATH];
  repeated uint32 lines = 5;             // 1-based lines of the version
}
message HunkContextEntry {
  string name = 1;
  string kind = 2;                       // function, method, class, module, component, scope, ...
}
message HunkContextLine {
  uint32 line = 1;
  repeated HunkContextEntry chain = 2;
}
// The conflicts of `change` (its newest version) with `target` (a branch name; empty means the default branch). The change
// stays open and nothing is written. `main` is the target's side and `change` the change's side; `base` is the common
// ancestor's text, empty when the merge has none to show. Each hunk lists the lines between the markers with the line numbers
// they start at in the file of that side; at most 50 files and 20 hunks of 200 lines per file are returned (`truncated`).
// `held_back` lists the changes stacked on this one, which wait for it; every other change is unaffected.
enum ConflictCheck {
  CONFLICT_CHECK_UNSPECIFIED = 0;
  CONFLICT_CHECK_CLEAN = 1;            // merges with nothing to resolve, or has nothing to merge
  CONFLICT_CHECK_CONFLICTS = 2;
  CONFLICT_CHECK_NEEDS_RESTACK = 3;    // sits on an older version of its parent, or shares no history with the target
}
message GetChangeConflictsRequest {
  RepoRef repo = 1;
  bytes change = 2 [(asc.v1.json) = JSON_KIND_CHANGE];
  string target = 3;
}
message ConflictHunk {
  uint32 main_start = 1;
  uint32 change_start = 2;
  repeated string main = 3;
  repeated string base = 4;
  repeated string change = 5;
}
message ConflictFile {
  bytes path = 1 [(asc.v1.json) = JSON_KIND_PATH];
  ConflictKind kind = 2;
  repeated ConflictHunk hunks = 3;
  bool binary = 4;                       // nothing to show line by line: pick a side
  bool truncated = 5;
}
message GetChangeConflictsResponse {
  ConflictCheck state = 1;
  repeated ConflictFile files = 2;
  repeated bytes held_back = 3 [(asc.v1.json) = JSON_KIND_CHANGE];
  bool truncated = 4;
}

// What a draft of a new change (title, what, why, how, risk) is written from: the subjects of the changesets in
// `base..head`, the files they touch with line counts, the size and the risk with its reasons. The patch text is read
// with `Repo.Diff`. `base` empty means the default branch and `head` empty means HEAD.
message DraftContextRequest {
  RepoRef repo = 1;
  string base = 2;
  string head = 3;
}
message DraftContextResponse {
  repeated string messages = 1;          // newest first, at most 50, each at most 200 bytes, one line
  repeated ChangeFileStat files = 2;     // at most 200
  uint32 added = 3;
  uint32 removed = 4;
  uint32 changesets = 5;
  ChangeRisk risk = 6;
  bool nothing_to_compare = 7;           // head holds nothing that base does not
  bool truncated = 8;
}

message HunkContextResponse {
  string language = 1;
  repeated HunkContextLine lines = 2;
}
