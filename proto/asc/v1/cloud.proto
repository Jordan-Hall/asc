syntax = "proto3";
package asc.v1;

import "asc/v1/options.proto";
import "asc/v1/repo.proto";

// Commit cloud (SPEC §21.3.5): per-user workspaces of draft heads on the server. Same port as Repo.
service Cloud {
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);          // cheap
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse); // background, x-asc-op-id
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);    // cheap, paged
  rpc Purge(PurgeRequest) returns (PurgeResponse);                               // owner (own unsubmitted drafts) or admin
  rpc ReportDevice(ReportDeviceRequest) returns (ReportDeviceResponse);          // owner; replaces the device's report
  rpc ReportWorktrees(ReportWorktreesRequest) returns (ReportWorktreesResponse); // owner; replaces the device's worktree set
  rpc ListWorktrees(ListWorktreesRequest) returns (ListWorktreesResponse);       // cheap, paged; own rows read, others write
}

// `change` is response only: the server derives it from the `m/` object of `cs` and ignores the client value.
// `labels` are at most 8, each at most 64 bytes of [A-Za-z0-9._/-], else INVALID_ARGUMENT. Untrusted text.
message CloudHead { bytes cs = 1; bytes change = 2; repeated string labels = 3; int64 added = 4; int64 hidden_at = 5;
  repeated string devices = 6; }   // response only: the devices whose last report holds this head too

// `owner` empty means the caller; reading another user's workspace needs repo write (§21.2.5).
message GetWorkspaceRequest { RepoRef repo = 1; string owner = 2; string name = 3;
  uint64 since_version = 4; int64 max_age_s = 5; bool include_hidden = 6; string page_token = 7;
  bool include_devices = 8; }   // fill CloudHead.devices and, on the first page, `local`
message GetWorkspaceResponse { uint64 version = 1; repeated CloudHead heads = 2; repeated bytes removed = 3;
  uint32 omitted = 4; string next_page_token = 5;
  repeated LocalDraft local = 6; }   // drafts a device reported that are not in the workspace

message UpdateWorkspaceRequest { RepoRef repo = 1; string name = 2; uint64 base_version = 3;
  repeated CloudHead add = 4; repeated bytes remove = 5; repeated bytes hide = 6; repeated bytes unhide = 7; }
// On ErrorDetail.code VERSION_CONFLICT, ErrorDetail.actual carries the current version as 8 big-endian bytes.
message UpdateWorkspaceResponse { uint64 version = 1; }

message WorkspaceInfo { string owner = 1; string name = 2; uint64 version = 3; uint32 heads = 4; int64 updated = 5; }
message ListWorkspacesRequest { RepoRef repo = 1; string owner = 2; uint32 limit = 3; string page_token = 4; }
message ListWorkspacesResponse { repeated WorkspaceInfo workspaces = 1; string next_page_token = 2; }

// Purge drafts (SPEC §21.3.7): writes gc_purge and cache_evict outbox rows in one transaction.
// `unacked_tiers` names cache tiers that have not yet acknowledged the eviction.
message PurgeRequest { RepoRef repo = 1; repeated bytes cs = 2; }
message PurgeResponse { uint32 purged = 1; repeated bytes refused = 2; repeated string unacked_tiers = 3; }

// Where a draft is (SPEC §21.3.9). A client tells the server which visible drafts one device holds and why
// each one that is not in the workspace stayed local, so the owner sees on the hub what is only on a laptop.
// Only metadata is sent: the change id, when the draft was made and its upload state; never content.
enum LocalDraftState {
  LOCAL_DRAFT_STATE_UNSPECIFIED = 0;
  LOCAL_DRAFT_STATE_UPLOADED = 1;    // in the workspace
  LOCAL_DRAFT_STATE_WAITING = 2;     // queued for upload
  LOCAL_DRAFT_STATE_FAILED = 3;      // the upload failed and is parked
  LOCAL_DRAFT_STATE_TOO_LARGE = 4;   // over the upload size limit
  LOCAL_DRAFT_STATE_NOT_QUEUED = 5;  // not in the upload queue: it was full, or the draft predates the cloud
}
// `cs` is the native changeset id (32 bytes) in a report; in GetWorkspace.local it is empty, as the server
// holds no object for it. `device` is response only.
message LocalDraft { bytes cs = 1; bytes change = 2; int64 added = 3; LocalDraftState state = 4;
  string device = 5; int64 reported_at = 6; }
// `device` is [A-Za-z0-9._-]{1,64}; `drafts` at most 1,000 (the newest). Needs the cloud flag of the repository.
message ReportDeviceRequest { RepoRef repo = 1; string name = 2; string device = 3; repeated LocalDraft drafts = 4; }
message ReportDeviceResponse { uint32 kept = 1; }

// Where a person's worktrees are (SPEC §21.3.9): one device tells the server what its worktrees of a repository
// hold, so the hub can show them. Metadata only: `ws_hash` is an opaque hash the device derives from the worktree
// (exactly 32 bytes); no local path, file name or content crosses the wire or is stored. `head_ref` is empty or a ref name by the
// rules of `git check-ref-format`, at most 256 bytes, `head` the native changeset id (32 bytes) or empty, `mode` at most 32 bytes,
// `in_progress` at most 64 bytes ("rebase", "merge", or empty). `ephemeral_until` is unix seconds, 0 for a
// worktree that stays. Rows are dropped 7 days after the last report of their device.
message WorktreeReport { bytes ws_hash = 1 [(asc.v1.json) = JSON_KIND_HEX]; string head_ref = 2;
  bytes head = 3 [(asc.v1.json) = JSON_KIND_HEX]; string mode = 4; bool dirty = 5; uint32 ahead = 6;
  uint32 behind = 7; int64 ephemeral_until = 8; string in_progress = 9; }
// `device` is [A-Za-z0-9._-]{1,64}; `worktrees` at most 256, and the report replaces every row of the caller's
// device. Needs the cloud flag of the repository.
message ReportWorktreesRequest { RepoRef repo = 1; string device = 2; repeated WorktreeReport worktrees = 3; }
message ReportWorktreesResponse { uint32 kept = 1; }

// `owner` empty means the caller. Another user's rows (a decimal user id), and `*` for the rows of every user,
// need repo write. Ordered by owner, device and `ws_hash`; `next_page_token` is empty on the last page.
message CloudWorktreeRow { string owner = 1; string device = 2; WorktreeReport worktree = 3; int64 reported_at = 4; }
message ListWorktreesRequest { RepoRef repo = 1; string owner = 2; string page_token = 3; }
message ListWorktreesResponse { repeated CloudWorktreeRow rows = 1; string next_page_token = 2; }
