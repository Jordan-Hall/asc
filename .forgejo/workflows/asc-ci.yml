name: asc-ci
on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - run: bash build/lint/no-main.sh --self-test
      - run: bash build/lint/no-main.sh
      - run: bash build/lint/no-raw-git.sh --self-test
      - run: bash build/lint/no-raw-git.sh
      - run: bash build/lint/no-raw-worktree-fs.sh --self-test
      - run: bash build/lint/no-raw-worktree-fs.sh
      - run: cargo test --workspace
