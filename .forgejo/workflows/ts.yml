name: ts-ci
on:
  push:
    branches: [master]
    paths:
      [
        "packages/**",
        "plugins/**",
        "proto/**",
        "package.json",
        "bun.lock",
        "turbo.json",
        "tsconfig.base.json",
        ".oxlintrc.json",
        "biome.json",
        ".forgejo/workflows/ts.yml",
      ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx biome format .
      - run: bunx turbo run lint typecheck
