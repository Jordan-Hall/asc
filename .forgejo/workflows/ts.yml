name: ts-ci
# Full CI runs nightly and on demand; every push is verified by the central gate and builds the
# image, so the single asc runner is not saturated by duplicate test jobs (2026-10-24).
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    paths:
      [
        "packages/**",
        "plugins/**",
        "proto/**",
        "package.json",
        "bun.lock",
        "turbo.json",
        "tsconfig.base.json",
        ".oxlintrc.json",
        "biome.json",
        ".forgejo/workflows/ts.yml",
      ]
  pull_request:

jobs:
  check:
    runs-on: ${{ github.event_name == 'pull_request' && 'asc-build' || 'asc-build-trusted' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: https://github.com/oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx biome format .
      - run: bunx turbo run lint typecheck
