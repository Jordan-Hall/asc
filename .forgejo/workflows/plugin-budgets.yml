name: plugin-budgets
# IDE plugin budget gate (SPEC 24.4.10, P44a). Bundle sizes and the bridge RSS always run; the
# extension-host probe runs when ASC_VSCODE_PATH points at a VS Code on the runner, otherwise it
# is reported unmeasured. Nightly and on demand, like ts-ci, so the single runner is not saturated.
on:
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - "bench/plugins/**"
      - "plugins/vscode/**"
      - "packages/asc-ui/**"
      - ".forgejo/workflows/plugin-budgets.yml"

jobs:
  vscode-budgets:
    runs-on: ${{ github.event_name == 'pull_request' && 'asc-build' || 'asc-build-trusted' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: https://github.com/oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=asc...
      - run: bun bench/plugins/collect.ts --target vscode --check
