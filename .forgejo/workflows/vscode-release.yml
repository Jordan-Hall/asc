name: vscode-release
# Publishes the ASC VS Code extension (SPEC 24.4, 24.9) to the VS Marketplace (vsce) and Open VSX
# (ovsx; Cursor and VSCodium). Tag vscode-v<MAJOR>.<MINOR>.<PATCH> must equal plugins/vscode/package.json
# `version` and have a CHANGELOG entry; `release-check.ts` enforces both before any token is used.
# Tokens come from the secrets VSCE_PAT and OVSX_PAT and reach the tools only through the environment
# (never argv, never echoed). Everything but the publish step is covered by `release-check.ts`; the first
# tagged release is watched by hand and recorded in plugins/vscode/CHANGELOG.md.
on:
  push:
    tags: ["vscode-v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and check only; publish nothing"
        type: boolean
        default: true

jobs:
  release:
    runs-on: asc-build-trusted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: https://github.com/oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Check the workflow and package
        run: bun plugins/vscode/scripts/release-check.ts
      - name: Check the tag against the version and CHANGELOG
        if: ${{ github.ref_type == 'tag' }}
        run: bun plugins/vscode/scripts/release-check.ts --tag "${GITHUB_REF_NAME}"
      - name: Test
        run: bun test
        working-directory: plugins/vscode
      - name: Package
        run: bun run package --out asc.vsix
        working-directory: plugins/vscode
      - name: Check the VSIX
        run: bun plugins/vscode/scripts/release-check.ts --vsix plugins/vscode/asc.vsix
      - name: Publish to the VS Marketplace
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: bunx vsce publish --packagePath plugins/vscode/asc.vsix --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: bunx ovsx@0.10.4 publish plugins/vscode/asc.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
